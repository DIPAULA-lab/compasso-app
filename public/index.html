/* ---- goal ↔ tasks/habits ---- */
const goalMode=g=>g.mode||(g.target>0?'manual':'auto');
const goalOf=id=>id?S.goals.find(g=>g.id===id):null;
function goalWindow(g,per){
  if(isPer(g)){const r=per||perRange(g.period);return {start:r.start,end:r.end}}
  const st=String(g.start||g.createdAt||today()).slice(0,10);return {start:st,end:g.deadline||''};
}
function habitGoalTarget(h,g,w){
  if(+h.goalTarget>0)return +h.goalTarget;
  w=w||goalWindow(g);if(!w.end)return 30;
  const from=w.start>hStart(h)?w.start:hStart(h);if(from>w.end)return 1;
  if(h.freq==='weekly')return Math.max(1,(h.target||1)*Math.max(1,Math.round((daysBetween(from,w.end)+1)/7)));
  let n=0,x=pd(from),c=0;while(dk(x)<=w.end&&c++<3000){if(isSched(h,dk(x)))n++;x=addD(x,1)}return Math.max(1,n);
}
function habitGoalDone(h,g,w){
  w=w||goalWindow(g);const from=w.start>hStart(h)?w.start:hStart(h);const to=w.end&&w.end<today()?w.end:today();
  let n=0,x=pd(from),c=0;while(dk(x)<=to&&c++<4000){if(doneOn(h.id,dk(x)))n++;x=addD(x,1)}return n;
}
function goalParts(g,per){
  const w=goalWindow(g,per);const items=[];
  S.tasks.filter(t=>t.goalId===g.id).forEach(t=>{
    const k=t.due||String(t.doneAt||t.createdAt||'').slice(0,10);
    if(isPer(g)&&(k<w.start||k>w.end))return;
    if(!isPer(g)&&w.end&&t.due&&t.due>w.end&&!t.done)return;
    items.push({kind:'task',id:t.id,title:t.title,w:+t.goalW||1,p:t.done?1:0,done:!!t.done});
  });
  S.habits.filter(h=>h.goalId===g.id&&!h.archived).forEach(h=>{
    const tg=habitGoalTarget(h,g,w),dn=habitGoalDone(h,g,w);
    items.push({kind:'habit',id:h.id,title:h.name,w:+h.goalW||1,p:Math.min(1,dn/tg),dn,tg});
  });
  return items;
}
function goalProg(g,per){
  if(goalMode(g)==='manual'){if(!(g.target>0))return null;const v=per?(+((g.prog||{})[per.key])||0):gCur(g);return clamp(v/g.target,0,1)}
  const it=goalParts(g,per);if(!it.length)return null;
  const W=it.reduce((a,x)=>a+x.w,0);return it.reduce((a,x)=>a+x.w*x.p,0)/W;
}
function goalSummary(g){
  if(goalMode(g)==='manual')return '';
  const it=goalParts(g);if(!it.length)return 'nenhuma tarefa ou hábito ligado';
  const ts=it.filter(x=>x.kind==='task'),hs=it.filter(x=>x.kind==='habit');const out=[];
  if(ts.length)out.push(`${ts.filter(x=>x.done).length}/${ts.length} tarefa${ts.length>1?'s':''}`);

}

/* ---- Estatísticas ---- */
const CH={};
function vStats(){
  const t=new Date();
  let h=vhead('Últimas semanas','Resumo');
  const hs=activeHabits();
  const cons=hs.map(x=>consistency(x)).filter(v=>v!=null);
  const avg=cons.length?cons.reduce((a,b)=>a+b,0)/cons.length:null;
  const d7=dk(addD(t,-6));
  const tdone7=S.tasks.filter(x=>x.done&&x.doneAt&&x.doneAt.slice(0,10)>=d7).length;
  const created30=S.tasks.filter(x=>String(x.createdAt||'').slice(0,10)>=dk(addD(t,-29)));
  const rate=created30.length?created30.filter(x=>x.done).length/created30.length:null;
  const w30=S.workouts.filter(w=>w.date>=dk(addD(t,-29)));
  const best=hs.map(x=>streak(x)).reduce((m,s)=>Math.max(m,s.n),0);
  const kpi=(v,l,c)=>`<div class="kpi ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  h+=`<div class="kpis kpis-cor">${kpi(avg==null?'–':Math.round(avg*100)+'<small>%</small>','consistência média dos hábitos (30 d)','k-hab')}${kpi(best,'maior sequência ativa','k-hab')}${kpi(tdone7,`tarefas concluídas em 7 dias${rate!=null?` · ${Math.round(rate*100)}% das criadas em 30 d`:''}`,'k-tar')}${kpi(w30.length,'treinos nos últimos 30 dias','k-tre')}</div>`;

  // weeks labels
  const weeks=[...Array(12)].map((_,i)=>addD(monOf(t),(i-11)*7));
  const wl=weeks.map(m=>fmtD(dk(m)));
  const wIn=(date,m)=>date>=dk(m)&&date<=dk(addD(m,6));
  CH.work={labels:wl,series:['strength','run','other'].map(k=>({name:WT[k].n,color:cv(WT[k].c),values:weeks.map(m=>S.workouts.filter(w=>w.type===k&&wIn(w.date,m)).length)})),fmt:v=>nf(v),target:weekTarget(),int:true};
  CH.km={labels:wl,series:[{name:'km',color:'var(--tre)',values:weeks.map(m=>S.workouts.filter(w=>w.type==='run'&&wIn(w.date,m)).reduce((s,w)=>s+(w.km||0),0))}],fmt:v=>nf(v,1)};
  CH.tasks={labels:wl,series:[{name:'Concluídas',color:'var(--tar)',values:weeks.map(m=>S.tasks.filter(x=>x.done&&x.doneAt&&wIn(x.doneAt.slice(0,10),m)).length)}],fmt:v=>nf(v),int:true};
  const runs=[...S.workouts].filter(w=>w.type==='run'&&w.km>0.5&&w.timeSec).sort((a,b)=>a.date.localeCompare(b.date)).slice(-20);
  CH.pace={points:runs.map(w=>({label:fmtD(w.date),y:w.timeSec/w.km/60,tip:`${fmtD(w.date)} · ${nf(w.km,2)} km\npace ${paceFmt(w.timeSec,w.km)}`})),color:'var(--tre)',fmt:v=>secFmt(v*60),name:'Pace (min/km)'};
  // exercises
  const exMap={};S.workouts.filter(w=>w.type==='strength').forEach(w=>(w.exercises||[]).forEach(e=>{if(!e.name)return;const k=e.name.trim();const top=Math.max(0,...(e.sets||[]).map(s=>+s.kg||0));if(!top)return;(exMap[k]=exMap[k]||[]).push({date:w.date,top,sets:e.sets})}));
  const exNames=Object.keys(exMap).sort((a,b)=>exMap[b].length-exMap[a].length||a.localeCompare(b));
  if(!exNames.includes(UI.exSel))UI.exSel=exNames[0]||'';
  const exPts=(exMap[UI.exSel]||[]).sort((a,b)=>a.date.localeCompare(b.date)).slice(-24);
  CH.ex={points:exPts.map(p=>({label:fmtD(p.date),y:p.top,tip:`${fmtD(p.date)} · carga máx ${nf(p.top,p.top%1?1:0)} kg\n${(p.sets||[]).map(s=>`${s.reps||'–'}×${s.kg||0}`).join('  ')}`})),color:'var(--str)',fmt:v=>nf(v,v%1?1:0)+' kg',name:'Carga máxima (kg)'};

  // heatmap card
  h+=`<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Hábitos · últimas <span data-heat-weeks>20</span> semanas</h2><span class="muted small">% dos hábitos diários cumpridos por dia</span></div>
    ${hs.length?`<div class="chart" data-chart="heat"></div><div class="hm-legend">menos <i style="background:var(--surface-2);border:1px solid var(--line)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><i style="background:var(--h5)"></i> 100%</div>`:emptyBox('stats','Sem hábitos ainda','Crie hábitos para ver o mapa de consistência.')}
  </section>`;
  // um mapa por hábito, no mesmo estilo do mapa geral
  if(hs.length){
    h+=`<div class="sec-h"><h2>Frequência por hábito</h2><span class="muted small" data-hm-weeks>últimas 20 semanas</span></div><div class="grid2 hmaps">`+hs.map(x=>{
      const st=streak(x),c=consistency(x);
      return `<section class="card hmap" style="--hc:${hColor(x)}"><div class="card-h"><h2><i class="hm-dot"></i><button data-act="habit-edit" data-id="${x.id}">${tn(x.name)}</button></h2><span class="muted small">${esc(habFreqLabel(x))}</span></div>

  }
  h+=`<div class="grid2">`;

  const openBy=catList().map(c=>({c,n:S.tasks.filter(x=>!x.done&&x.cat===c.id).length})).filter(x=>x.n);const mx=Math.max(1,...openBy.map(x=>x.n));

   :'<div class="empty">Sem dados neste período.</div>'}</section>`;

/* ============ charts (SVG) ============ */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function topRound(x,y,w,h,r){r=Math.min(r,w/2,h);if(h<=0)return '';return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function drawCharts(){
  document.querySelectorAll('[data-chart]').forEach(el=>{
    const k=el.dataset.chart;if(k==='heat')return drawHeat(el);
    if(!CH[k])return;el.dataset.kind==='line'?drawLine(el,CH[k]):drawBars(el,CH[k]);
  });
}
function drawBars(el,c){
  const W=Math.max(260,el.clientWidth),H=190,ml=30,mr=6,mt=8,mb=22,iw=W-ml-mr,ih=H-mt-mb;
  const tot=c.labels.map((_,i)=>c.series.reduce((s,se)=>s+(se.values[i]||0),0));
  let max=niceMax(Math.max(...tot,c.target||0));if(c.int)max=Math.max(4,Math.ceil(max/4)*4);const y=v=>mt+ih-v/max*ih;
  const step=iw/c.labels.length,bw=Math.min(26,step*.62);let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);s+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${ml-6}" y="${yy+3.5}" text-anchor="end">${c.fmt(v)}</text>`}
  const every=Math.ceil(c.labels.length/Math.max(1,Math.floor(iw/52)));
  c.labels.forEach((l,i)=>{
    const x=ml+step*i+(step-bw)/2;let base=mt+ih;const segs=c.series.map(se=>({v:se.values[i]||0,col:se.color,n:se.name})).filter(z=>z.v>0);
    segs.forEach((z,j)=>{const hh=z.v/max*ih;const top=base-hh;const gap=j<segs.length-1?0:0;
      s+=j===segs.length-1?`<path d="${topRound(x,top,bw,hh,4)}" fill="${z.col}"/>`:`<rect x="${x}" y="${top}" width="${bw}" height="${Math.max(0,hh)}" fill="${z.col}"/>`;
      base=top;if(j<segs.length-1){s+=`<rect x="${x}" y="${top-1}" width="${bw}" height="2" fill="var(--surface)"/>`;base=top}});
    if(i%every===0)s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${l}</text>`;
    const tip=`Semana de ${l}\n`+c.series.map(se=>`${c.series.length>1?se.name+': ':''}${c.fmt(se.values[i]||0)}${c.series.length===1&&se.name==='km'?' km':''}`).join('\n');
    s+=`<rect x="${ml+step*i}" y="${mt}" width="${step}" height="${ih}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  if(c.target){const yy=y(c.target);s+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--ink-2)" stroke-dasharray="4 4" stroke-width="1.2"/>`}
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}" stroke="var(--line-2)"/>`;
  el.innerHTML=s+'</svg>';
}
function drawLine(el,c){
  const W=Math.max(260,el.clientWidth),H=200,ml=48,mr=14,mt=12,mb=22,iw=W-ml-mr,ih=H-mt-mb;const P=c.points;
  let lo=Math.min(...P.map(p=>p.y)),hi=Math.max(...P.map(p=>p.y));const padv=(hi-lo)*.15||hi*.1||1;lo=Math.max(0,lo-padv);hi=hi+padv;
  const x=i=>ml+(P.length===1?iw/2:iw*i/(P.length-1)),y=v=>mt+ih-(v-lo)/(hi-lo)*ih;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.name)}">`;
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,yy=y(v);s+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${ml-6}" y="${yy+3.5}" text-anchor="end">${c.fmt(v)}</text>`}
  const d=P.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.y)}`).join('');
  s+=`<path d="${d}V${mt+ih}H${x(0)}Z" fill="${c.color}" opacity=".10"/><path d="${d}" fill="none" stroke="${c.color}" stroke-width="2" stroke-linejoin="round"/>`;
  const every=Math.ceil(P.length/Math.max(1,Math.floor(iw/56)));
  P.forEach((p,i)=>{const last=i===P.length-1;
    s+=`<circle cx="${x(i)}" cy="${y(p.y)}" r="${last?5:3.5}" fill="${c.color}" stroke="var(--surface)" stroke-width="2"/>`;
    if(i%every===0)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${p.label}</text>`;
    s+=`<circle cx="${x(i)}" cy="${y(p.y)}" r="13" fill="transparent" data-tip="${esc(p.tip)}"/>`;});
  const lp=P[P.length-1];s+=`<text x="${Math.min(x(P.length-1),W-mr)}" y="${y(lp.y)-10}" text-anchor="end" style="fill:var(--ink);font-weight:500">${c.fmt(lp.y)}</text>`;
  el.innerHTML=s+'</svg>';
}
function drawHeat(el){
  // como no GitHub: quadradinhos de ~18px e tantas semanas quantas couberem (de 20 a 53), ocupando a largura toda
  const W=Math.max(260,el.clientWidth),lw=26,gap=3,avail=W-lw;
  const nativeCols=clamp(Math.floor((avail+gap)/(18+gap)),20,53),cols=compassoMapWeeks,step=Math.min(25,(avail+gap)/nativeCols),rs=Math.round(step);
  const cs=rs-gap,H=18+7*rs-gap,X=c=>Math.round(lw+c*step),Y=r=>18+r*rs;
  const start=addD(monOf(new Date()),-(cols-1)*7);const tk=today();
  const hb=el.dataset.habit?S.habits.find(x=>x.id===el.dataset.habit):null;
  let s=`<svg width="${X(cols)-gap}" height="${H}" role="img" aria-label="${hb?'Frequência de '+esc(hb.name):'Mapa de consistência dos hábitos'}">`;
  ['seg','','qua','','sex','',''].forEach((l,r)=>{if(l)s+=`<text x="0" y="${Y(r)+cs-2}">${l}</text>`});
  let lastM=-1,lastX=-99,n=0;
  for(let c=0;c<cols;c++){const mon=addD(start,c*7);
    if(mon.getMonth()!==lastM){lastM=mon.getMonth();if(X(c)-lastX>=28){s+=`<text x="${X(c)}" y="10">${MES[lastM]}</text>`;lastX=X(c)}}
    for(let r=0;r<7;r++){const d=addD(mon,r),k=dk(d);if(k>tk)continue;
      const box=`x="${X(c)}" y="${Y(r)}" width="${X(c+1)-gap-X(c)}" height="${cs}" rx="2.5"`;
      if(hb){const done=doneOn(hb.id,k),pre=k<hStart(hb),off=!pre&&hb.freq==='sched'&&!isSched(hb,k);if(done)n++;
        s+=`<rect ${box} fill="${done?'var(--hc)':'var(--surface-2)'}" stroke="var(--line)" stroke-width="${done?0:1}" opacity="${done?1:pre?.3:off?.45:1}" data-tip="${esc(`${DOW[r]}, ${fmtD(k)}\n${done?'feito':pre?'antes de criar o hábito':off?'fora da programação':'não feito'}`)}"/>`;continue}
      const p=dayPct(k);
      const fill=p==null||p===0?'var(--surface-2)':p<.26?'var(--h1)':p<.51?'var(--h2)':p<.76?'var(--h3)':p<1?'var(--h4)':'var(--h5)';
      s+=`<rect ${box} fill="${fill}" stroke="var(--line)" stroke-width="${p?0:1}" data-tip="${esc(`${DOW[r]}, ${fmtD(k)}\n${p==null?'sem hábitos':Math.round(p*100)+'% dos hábitos'}`)}"/>`}}
  el.innerHTML=`<div style="overflow-x:auto">${s}</svg></div>`;
  // textos que dependem de quantas semanas couberam
  const card=el.closest('section');
  if(hb){const f=card&&card.querySelector('[data-hm-n]');if(f)f.innerHTML=`<b>${n}</b> ${n===1?'vez':'vezes'} no período`;
    const wl=document.querySelector('[data-hm-weeks]');if(wl)wl.textContent=`últimas ${cols} semanas`}
  else{const wl=card&&card.querySelector('[data-heat-weeks]');if(wl)wl.textContent=cols}
}

/* ============ movimento ============
   A tela é atualizada no lugar (morph): só muda o que mudou, então cada elemento pode
   animar a própria mudança. Linhas com data-key entram e saem animadas; números que
   mudam fazem um "tick". Troca de tela, carga inicial e filtros não animam linhas. */
const EZ='cubic-bezier(.2,.8,.2,1)',EZ_IN='cubic-bezier(.4,0,1,1)',EZ_POP='cubic-bezier(.34,1.56,.64,1)';
const motionOK=()=>!matchMedia('(prefers-reduced-motion: reduce)').matches;
const BOOT=performance.now();let quiet=0;
const calm=()=>quiet>0||dbState!=='ok'||performance.now()-BOOT<1500||!motionOK();
function quietRender(){quiet++;try{render()}finally{quiet--}}
const pinned=n=>n.nodeType===1&&(n.hasAttribute('data-leaving')||n.hasAttribute('data-persist'));
const mkey=n=>n.nodeType!==1?null:n.id||n.getAttribute('data-key')||(n.hasAttribute('data-act')&&n.hasAttribute('data-id')?n.getAttribute('data-act')+':'+n.getAttribute('data-id')+':'+(n.getAttribute('data-k')||''):null);
function morph(el,html,anim){const t=document.createElement(el.tagName);t.innerHTML=html;morphKids(el,t,anim)}
function morphKids(a,b,anim){
  const kids=[...b.childNodes],want=new Set(kids.map(mkey).filter(Boolean)),keyed=new Map(),dead=[];
  for(let n=a.firstChild;n;n=n.nextSibling){const k=mkey(n);if(k&&!pinned(n))keyed.set(k,n)}
  let cur=a.firstChild;
  // linhas que vão sair ficam no lugar (para encolher onde estavam) e não travam o pareamento
  const skip=()=>{while(cur&&(pinned(cur)||(mkey(cur)&&!want.has(mkey(cur))))){if(!pinned(cur))dead.push(cur);cur=cur.nextSibling}};
  for(const nn of kids){
    skip();
    const k=mkey(nn);let m=null;
    if(k){m=keyed.get(k);if(m&&m.nodeName!==nn.nodeName)m=null;if(m)keyed.delete(k)}
    else if(cur&&!mkey(cur)&&cur.nodeType===nn.nodeType&&cur.nodeName===nn.nodeName)m=cur;
    if(m){if(m===cur)cur=cur.nextSibling;else a.insertBefore(m,cur);morphNode(m,nn,anim)}
    else{a.insertBefore(nn,cur);if(anim&&nn.nodeType===1&&nn.hasAttribute('data-key'))enterEl(nn)}
  }
  for(;cur;cur=cur.nextSibling)if(!pinned(cur))dead.push(cur);
  dead.forEach(n=>{if(anim&&n.nodeType===1&&n.hasAttribute('data-key'))leaveEl(n);else n.remove()});
}
function morphNode(a,b,anim){
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue){a.nodeValue=b.nodeValue;if(anim&&a.nodeType===3)tick(a.parentNode)}return}
  for(const {name} of [...a.attributes])if(!b.hasAttribute(name))a.removeAttribute(name);
  for(const {name,value} of [...b.attributes])if(a.getAttribute(name)!==value){
    a.setAttribute(name,value);
    if(anim&&name==='aria-checked'&&value==='true')pop(a);
  }
  if(a===document.activeElement&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;
  morphKids(a,b,anim);
}
// abre espaço e aparece / encolhe e some, empurrando os vizinhos com suavidade
function boxFrames(el){const cs=getComputedStyle(el);return {h:el.offsetHeight+'px',pt:cs.paddingTop,pb:cs.paddingBottom,mt:cs.marginTop,mb:cs.marginBottom}}
const shut={height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px',opacity:0};
function enterEl(el){
  const f=boxFrames(el);el.style.overflow='hidden';
  el.animate([{...shut,transform:'translateY(-4px)'},{height:f.h,paddingTop:f.pt,paddingBottom:f.pb,marginTop:f.mt,marginBottom:f.mb,opacity:1,transform:'none'}],{duration:300,easing:EZ})
    .finished.then(()=>{el.style.overflow=''},()=>{});
}
function leaveEl(el){
  el.setAttribute('data-leaving','');el.style.pointerEvents='none';
  const f=boxFrames(el);el.style.overflow='hidden';
  const wait=el.classList.contains('just-done')?520:0;
  el.animate([{height:f.h,paddingTop:f.pt,paddingBottom:f.pb,marginTop:f.mt,marginBottom:f.mb,opacity:1},shut],{duration:280,delay:wait,easing:EZ,fill:'forwards'})
    .finished.then(()=>el.remove(),()=>el.remove());
}
function pop(el){
  el.animate([{transform:'scale(1)'},{transform:'scale(1.3)',offset:.35},{transform:'scale(1)'}],{duration:360,easing:EZ_POP});
  if(el.classList.contains('hl-ck'))el.animate([{boxShadow:'0 0 0 0 color-mix(in srgb,var(--gc) 55%,transparent)'},{boxShadow:'0 0 0 10px color-mix(in srgb,var(--gc) 0%,transparent)'}],{duration:520,easing:'ease-out'});
}
function tick(p){
  const el=p&&p.closest&&p.closest('.v,.gl-p,.hg-c,.km-v,.hl-s,.task-list-title .mono,.fchip .n');if(!el)return;
  const block=getComputedStyle(el).display!=='inline';
  el.animate(block?[{transform:'translateY(.3em)',opacity:.15},{transform:'none',opacity:1}]:[{opacity:.15},{opacity:1}],{duration:280,easing:EZ});

  document.querySelectorAll('.rings-w svg circle[style]').forEach((c,i)=>{const C=+c.getAttribute('stroke-dasharray'),to=parseFloat(c.style.strokeDashoffset);

function placeNavInd(){
  const nav=$('#nav');let ind=nav.querySelector('.nav-ind');
  if(!ind){ind=document.createElement('i');ind.className='nav-ind';ind.setAttribute('aria-hidden','true');ind.setAttribute('data-persist','');nav.prepend(ind)}
  const b=nav.querySelector('[aria-current="page"]');
  if(!b||getComputedStyle(ind).display==='none'){nav.classList.remove('has-ind');return}
  const x=b.offsetLeft,w=b.offsetWidth,ox=+ind.dataset.x,ow=+ind.dataset.w;
  if(x===ox&&w===ow&&nav.classList.contains('has-ind'))return;
  ind.style.width=w+'px';ind.style.transform=`translateX(${x}px)`;ind.dataset.x=x;ind.dataset.w=w;nav.classList.add('has-ind');
  if(ind.dataset.x&&!isNaN(ox)&&!viewTr&&motionOK())ind.animate([{width:ow+'px',transform:`translateX(${ox}px)`},{width:w+'px',transform:`translateX(${x}px)`}],{duration:420,easing:'cubic-bezier(.3,1.25,.5,1)'});
}

function switchView(v,opt={}){

  const order=VIEWS.map(x=>x[0]),dir=order.indexOf(v)>=order.indexOf(UI.view)?1:-1;
  scrollMem[UI.view]=window.scrollY;
  if(!opt.back){try{history.pushState({v},'','#'+v)}catch{}}
  const go=()=>{UI.view=v;quietRender();window.scrollTo(0,opt.back?(scrollMem[v]||0):0)};
  const main=$('#main'),ind=$('#nav .nav-ind');
  if(document.startViewTransition&&motionOK()){
    document.documentElement.dataset.dir=dir>0?'fwd':'back';
    main.style.viewTransitionName='main';if(ind)ind.style.viewTransitionName='nav-ind';
    viewTr=document.startViewTransition(go);

    put('goals',id,{mode:fv('f-mode')||'auto',start:fv('f-start')||String(old.start||old.createdAt||now).slice(0,10),title:fv('f-title'),cat:fv('f-cat'),period:per,prog,deadline:per==='none'?fv('f-deadline'):'',current:per==='none'?cv0:(+old.current||0),target:tg===''?null:+tg,unit:fv('f-unit'),notes:fv('f-notes'),done:!!(document.getElementById('f-done')||{}).checked,createdAt:old.createdAt||now})}
  if(k==='settings'){applyTheme(fv('f-theme')||getTheme());const sk=document.getElementById('f-skey');if(sk&&sk.value.trim()&&window.CompassoLocal)window.CompassoLocal.strava.setKey(sk.value);readCatDraft();saveConn(UI.connDraft);putMeta('categories',{items:UI.catDraft.filter(c=>c.name)});putMeta('settings',{...S.settings,workoutTarget:clamp(+fv('f-wt')||4,1,14)})}
  if(k==='workout'){readDraft();const w=UI.draft;
    const exs=w.type==='strength'?w.exercises.filter(e=>e.name.trim()).map(e=>({name:e.name.trim(),sets:(e.sets||[]).filter(s=>s.reps!==''||s.kg!=='').map(s=>({reps:s.reps===''?'':+s.reps,kg:s.kg===''?'':+s.kg}))})):[];
    if(UI.draftMode==='plan'){
      if(!hasRec(w.rec)){toast('Escolha a frequência do treino recorrente.');return}
      const r={...w.rec,start:w.rec.start||today()};
      if(r.freq==='weekly'&&!r.days.length){toast('Marque pelo menos um dia da semana.');return}
      put('plans',w.id||uid(),{type:w.type,title:w.title||WT[w.type].n,exercises:exs,durMin:w.durMin||0,km:+w.km||0,timeSec:w.timeSec||0,notes:w.notes,rec:r,active:w.active!==false,createdAt:w.createdAt||now});
      closeModal();return;
    }
    let planId=w.planId||null;
    if(w.endDate&&hasRec(w.rec)){toast('Para um treino de vários dias, selecione Não repete.');return}
    if(!w.id&&!planId&&hasRec(w.rec)){const r={...w.rec,start:w.rec.start||w.date};planId=uid();
      put('plans',planId,{type:w.type,title:w.title||WT[w.type].n,exercises:exs,durMin:w.durMin||0,km:+w.km||0,timeSec:w.timeSec||0,notes:'',rec:r,active:true,createdAt:now});
      if(w.date>today()||!occursOn(r,w.date)){toast(`Treino recorrente criado · ${recLabel(r)}`);closeModal();return}
      toast(`Treino registrado e programado · ${recLabel(r)}`)}
    const wid=w.id||uid();const {rec:_r,active:_a,...wbase}=strip(w);
    const doc={...wbase,planId,type:w.type,title:w.title,date:w.date,durMin:w.durMin||(w.type==='run'&&w.timeSec?Math.round(w.timeSec/60):0),notes:w.notes,
      exercises:w.type==='strength'?exs:(w.exercises||[]),
      km:+w.km||0,timeSec:w.timeSec||0,source:w.source||'manual',createdAt:w.createdAt||now};
    put('workouts',wid,doc)}
  closeModal();
});
// tooltips
const tip=$('#tip');
function showTip(el,x,y){tip.textContent=el.getAttribute('data-tip');tip.hidden=false;const r=tip.getBoundingClientRect();tip.style.left=clamp(x+12,8,window.innerWidth-r.width-8)+'px';tip.style.top=clamp(y-r.height-12,8,window.innerHeight-r.height-8)+'px'}
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true});
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&e.pointerType!=='mouse')showTip(el,e.clientX,e.clientY)});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{drawCharts();placeNavInd()},150)});
// aviso no rodapé; com "act" ganha um botão (ex.: Desfazer) e fica mais tempo na tela
let tt;function toast(m,act){
  const t=$('#toast'),was=!t.hidden&&!t.classList.contains('out');clearTimeout(tt);
  const s=document.createElement('span');s.textContent=m;t.replaceChildren(s);
  if(act){const b=document.createElement('button');b.type='button';b.className='toast-act';b.textContent=act.label;b.addEventListener('click',()=>{hideToast();act.fn()});t.append(b)}
  t.classList.remove('out');t.getAnimations().forEach(x=>x.cancel());t.hidden=false;
  if(motionOK())t.animate(was?[{transform:'translateX(-50%) scale(.97)'},{transform:'translateX(-50%) scale(1)'}]:[{opacity:0,transform:'translate(-50%,16px) scale(.96)'},{opacity:1,transform:'translateX(-50%)'}],{duration:was?180:340,easing:was?EZ:EZ_POP});
  tt=setTimeout(hideToast,act?6000:3200);
}
function hideToast(){
  const t=$('#toast');clearTimeout(tt);if(t.hidden||t.classList.contains('out'))return;
  const end=()=>{if(!t.classList.contains('out'))return;t.hidden=true;t.classList.remove('out');t.getAnimations().forEach(x=>x.cancel())};
  t.classList.add('out');
  if(!motionOK())return end();
  t.animate([{opacity:1,transform:'translateX(-50%)'},{opacity:0,transform:'translate(-50%,10px)'}],{duration:180,easing:EZ_IN,fill:'forwards'}).finished.then(end,end);
}

/* ============ tema ============ */
const THEMES=[['light','Claro'],['dark','Escuro'],['auto','Automático (segue o Mac)']];
function getTheme(){try{return localStorage.getItem('compasso:theme')||'light'}catch{return 'light'}}
const isDark=()=>{const t=getTheme();return t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)};
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function applyTheme(t){
  try{localStorage.setItem('compasso:theme',t)}catch{}
  const r=document.documentElement;if(t==='auto')delete r.dataset.theme;else r.dataset.theme=t;
  const dark=isDark();
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.content=dark?'#000000':'#FFFFFF');
  const b=document.getElementById('theme-t');
  if(b){b.innerHTML=dark?SUN:MOON;b.title=b.ariaLabel=dark?'Mudar para o modo claro':'Mudar para o modo escuro'}
  schedule();
}

<script>
/* ============ boot ============ */
applyTheme(getTheme());
window.addEventListener('compasso:status',()=>schedule());
{const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]===h))UI.view=h}
render();
(async()=>{
  const C=window.claude;
  const [d,m]=await Promise.all([C&&C.use?C.use('db').catch(()=>null):null,C&&C.use?C.use('mcp').catch(()=>null):null]);
  db=d;mcp=m;dbState=db?'wait':'off';
  if(db){
    const loadedCols=new Set();
    const onErr=e=>{if(e&&(e.code==='revoked'||e.code==='not_granted'||e.code==='capability_disabled')){dbState='off';db=null}schedule()};
    db.collection('plans').onSnapshot(snap=>{S.plans=snap.docs.filter(x=>x.exists).map(x=>({id:x.id,...x.data()}));schedule()},onErr);
    ['habits','goals','tasks','workouts','events'].forEach(col=>{
      db.collection(col).onSnapshot(snap=>{
        S[col]=snap.docs.filter(x=>x.exists).map(x=>({id:x.id,...x.data()}));
        if(!snap.metadata.fromCache){loadedCols.add(col);if(loadedCols.size>=5)dbState='ok';
          if(col==='workouts'&&!SV.auto&&mcp){SV.auto=true;syncStrava(false)}}
        schedule();
      },onErr);
    });
    db.collection('habitlog').onSnapshot(snap=>{S.logs=Object.fromEntries(snap.docs.map(x=>[x.id,x.data()]));schedule()},onErr);
    db.doc('meta/categories').onSnapshot(s=>{S.cats=s.exists?(s.data().items||[]):[];schedule()},onErr);
    db.doc('meta/settings').onSnapshot(s=>{if(s.exists)S.settings={workoutTarget:4,...s.data()};schedule()},onErr);
  }else if(mcp){SV.auto=true;syncStrava(false)}
  if(mcp){const t=new Date();const s=new Date(t.getFullYear(),t.getMonth(),t.getDate());const m0=monOf(s);watchCal('soon',m0,addD(m0,15))}
  schedule();
})();
</script>
