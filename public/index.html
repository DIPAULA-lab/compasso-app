/* Tokens · design 2026 (Figma "compass"): branco, cartões com sombra suave, Raleway + Inter */
:root{
  color-scheme:light;

  --accent:var(--ink); --accent-ink:var(--bg); --accent-soft:rgba(0,0,0,.07);
  --good:#00C13C; --warn:#FF9500; --bad:#E5002D; --bad-soft:#FFE3EA;
  --c1:#0A6CFF; --c2:#FF7A00; --c3:#00E2FC; --c4:#FFC400; --c5:#FF0049; --c6:#00D543; --c7:#8B3DFF; --c8:#C1121F;

  --r-tile:15px; --r-ctl:12px;
  --f-display:"Raleway",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-body:"Raleway",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-num:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"Inter",ui-monospace,"SF Mono",Menlo,monospace;
}

    --blue:#3D8BFF;
    --hab:#FF2A66; --on-hab:#FFFFFF; --tar:#1AE05A; --on-tar:#00230C; --tre:#40B8F2; --on-tre:#00202E; --str:#A06BFF;
    --accent-soft:rgba(255,255,255,.12);
    --good:#1AE05A; --warn:#FF9F0A; --bad:#FF3366; --bad-soft:#3A0E1A;
    --c1:#3D8BFF; --c2:#FF8A1F; --c3:#00E2FC; --c4:#FFD000; --c5:#FF2A66; --c6:#1AE05A; --c7:#A06BFF; --c8:#E5383B;
    --h1:#3D0716; --h2:#6E0A28; --h3:#A80D3C; --h4:#E3104F; --h5:#FF5C8A;
    --track:.22;
    --shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 44px -12px rgba(0,0,0,.85);
    --card-shadow:0 0 0 1px rgba(255,255,255,.04); --pill-shadow:none; --pill-line:#2A2A2A;
    --due-red:#E5484D; --due-yellow:#FFD500; --due-green:#1AE05A;
    --k-blue:#22BFFF; --k-red:#FF2A66; --k-lime:#87FF00; --k-indigo:#8C8AFF;
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#000000; --surface:#121212; --surface-2:#1C1C1C; --fill:#262626; --line:#232323; --line-2:#303030;
    --ink:#FFFFFF; --ink-2:#E6E6E6; --ink-3:#8E8E93;
    --blue:#3D8BFF;
    --hab:#FF2A66; --on-hab:#FFFFFF; --tar:#1AE05A; --on-tar:#00230C; --tre:#40B8F2; --on-tre:#00202E; --str:#A06BFF;
    --accent-soft:rgba(255,255,255,.12);
    --good:#1AE05A; --warn:#FF9F0A; --bad:#FF3366; --bad-soft:#3A0E1A;
    --c1:#3D8BFF; --c2:#FF8A1F; --c3:#00E2FC; --c4:#FFD000; --c5:#FF2A66; --c6:#1AE05A; --c7:#A06BFF; --c8:#E5383B;
    --h1:#3D0716; --h2:#6E0A28; --h3:#A80D3C; --h4:#E3104F; --h5:#FF5C8A;
    --track:.22;
    --shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 44px -12px rgba(0,0,0,.85);
    --card-shadow:0 0 0 1px rgba(255,255,255,.04); --pill-shadow:none; --pill-line:#2A2A2A;
    --due-red:#E5484D; --due-yellow:#FFD500; --due-green:#1AE05A;
    --k-blue:#22BFFF; --k-red:#FF2A66; --k-lime:#87FF00; --k-indigo:#8C8AFF;
}
/* Each area tints its own screen */
[data-area="habitos"]{--accent:var(--hab);--accent-ink:var(--on-hab);--accent-soft:color-mix(in srgb,var(--hab) 16%,transparent)}
[data-area="tarefas"]{--accent:var(--tar);--accent-ink:var(--on-tar);--accent-soft:color-mix(in srgb,var(--tar) 18%,transparent)}
[data-area="treinos"]{--accent:var(--tre);--accent-ink:var(--on-tre);--accent-soft:color-mix(in srgb,var(--tre) 18%,transparent)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono,.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.035em}
h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
h3{font-size:15px;font-weight:600}
.eyebrow{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px;font-weight:600}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* Shell: top bar with segmented control, bottom tab bar on phones */
.app{min-height:100%;display:flex;flex-direction:column}
.side{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:calc(12px + env(safe-area-inset-top,0px)) clamp(16px,3.5vw,44px) 12px;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-bottom:.5px solid transparent}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:24px;height:24px;flex:none}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.025em}
.nav{display:flex;padding:3px;border-radius:11px;background:var(--fill)}
.nav button{display:flex;align-items:center;gap:7px;padding:6px 15px;border:0;background:none;border-radius:8px;color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s}
.nav button svg{width:16px;height:16px;flex:none;display:none}
.nav button:hover{background:color-mix(in srgb,var(--surface) 50%,transparent)}
.nav button[aria-current="page"]{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.side-foot{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.conn{display:flex;gap:4px;align-items:center;padding:7px 11px;border-radius:99px;background:var(--surface);font-size:12px;color:var(--ink-3)}
.conn span{display:flex;align-items:center;gap:5px}
.conn span em{font-style:normal;display:none}
.conn span+span{margin-left:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--good)} .dot.err{background:var(--bad)} .dot.wait{background:var(--warn)}
.side-foot .btn{border-radius:99px;padding:7px 12px}
main{padding-block:18px 64px;padding-inline:clamp(16px,3.5vw,44px);min-width:0;max-width:1240px;width:100%;margin:0 auto}

/* Generic */
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:99px;border:0;background:var(--surface);color:var(--blue);font-weight:600;font-size:13.5px;white-space:nowrap;transition:filter .15s,transform .1s}
[data-area="habitos"] .btn:not(.primary):not(.danger):not(.ghost),[data-area="tarefas"] .btn:not(.primary):not(.danger):not(.ghost),[data-area="treinos"] .btn:not(.primary):not(.danger):not(.ghost){color:var(--ink)}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--blue);padding-inline:8px}
.btn.small{font-size:13px;padding:5px 10px}
.btn.danger{color:var(--bad);background:none}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.sheet .btn:not(.primary):not(.ghost):not(.danger),.card .btn:not(.primary):not(.ghost):not(.danger){background:var(--fill)}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--ink)}
.iconbtn:hover{filter:brightness(.94)}
.iconbtn svg{width:16px;height:16px}
.vh .iconbtn{background:var(--surface)}
.card{background:var(--surface);border:0;border-radius:var(--r-tile);padding:18px 20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h2{font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:var(--r-tile);padding:16px 18px}
.kpi .v{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1.05;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--ink-3);font-weight:600;letter-spacing:-.01em}
.kpi .l{font-size:13px;color:var(--ink-3);margin-top:4px}
.kpi.solid,[data-area="treinos"] .kpis .kpi:first-child{background:var(--accent);color:var(--accent-ink)}
[data-area="treinos"] .kpis .kpi:first-child .v small,[data-area="treinos"] .kpis .kpi:first-child .l{color:inherit;opacity:.8}
[data-area="treinos"] .kpis .kpi:first-child .meter{background:color-mix(in srgb,var(--accent-ink) 25%,transparent)}
[data-area="treinos"] .kpis .kpi:first-child .meter i{background:var(--accent-ink)}
.kpi.solid .v small,.kpi.solid .l{color:inherit;opacity:.8}
.kpi.solid .meter{background:color-mix(in srgb,var(--accent-ink) 25%,transparent)}
.kpi.solid .meter i{background:var(--accent-ink)}
.meter{height:6px;border-radius:9px;background:var(--fill);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px}
.empty{padding:22px 18px;border-radius:16px;background:var(--surface-2);color:var(--ink-3);text-align:center;font-size:14px}
.empty .btn{margin-top:12px;background:var(--surface)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface);font-size:13.5px;color:var(--ink-2);margin-bottom:12px}
.sheet .banner{background:var(--surface-2)}
.banner.err{background:var(--bad-soft);color:var(--ink)}
.banner b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--fill);color:var(--ink-3);white-space:nowrap}
.tag.late{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.tag.today{color:var(--blue);background:var(--accent-soft)}
[data-area] .tag.today{color:var(--ink)}
.prio{font-size:12px;font-weight:600}
.prio.p1{color:var(--bad)} .prio.p2{color:var(--warn)} .prio.p3{color:var(--ink-3)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--fill)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13.5px;color:var(--ink);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;border:0;background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fchip i{width:8px;height:8px;border-radius:50%}
.fchip .n{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}

/* Lists: iOS grouped rows with inset separators */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:36px;right:0;height:.5px;background:var(--line-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;font-size:15px;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.row .t:hover{opacity:.7}
.row .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:3px}
.row.done .t{text-decoration:line-through;color:var(--ink-3)}
.check{--accent:var(--tar);--accent-ink:var(--on-tar);flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);background:none;display:grid;place-items:center;margin-top:-1px;padding:0;transition:background .15s,border-color .15s,transform .1s}
.check svg{width:13px;height:13px;opacity:0;color:var(--accent-ink)}
.check:hover{border-color:var(--accent)}
.check:active{transform:scale(.9)}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] svg{opacity:1}
.check.round{--accent:var(--hab);--accent-ink:var(--on-hab)}
.group-h{display:flex;align-items:baseline;gap:8px;margin:20px 0 4px;font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.group-h:first-child{margin-top:0}
.group-h .mono{font-family:inherit}
.group-h.late{color:var(--bad)}
.task-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;align-items:start}
.task-list-card{min-width:0;padding:16px;border-radius:var(--r-tile);background:var(--surface-2)}
.task-list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.task-list-title{display:flex;align-items:center;gap:8px;min-width:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.task-list-title i{width:9px;height:9px;border-radius:50%;background:var(--task-cat,var(--ink-3));flex:none}
.task-list-title .mono{color:var(--ink-3);font-size:12px;font-weight:500}
.task-list-card .group-h{margin-top:14px}
.task-list-head+.group-h{margin-top:0}
.task-list-card .row{gap:9px}
.task-list-card .row .meta{gap:5px 8px}
.task-list-card .task-empty{padding:12px 8px;border-radius:12px;background:var(--surface);font-size:13px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.quick input[type=text]{flex:1 1 200px}
.quick .btn.primary{padding:8px 12px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--fill);border:0;border-radius:var(--r-ctl);padding:10px 12px;min-width:0;max-width:100%;font-size:15px}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft),inset 0 0 0 1.5px var(--accent)}
textarea{width:100%;min-height:80px;resize:vertical}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.streak{font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.streak b{color:var(--ink);font-weight:600}

/* Today: widget grid with the rings */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
@media (min-width:1101px){.bento .col > .card:last-child{flex:1}}
.bento .span2{grid-column:span 2}
.rings-w{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:26px;padding:22px 28px}
.rings-w svg{width:200px;height:200px;display:block}
.rings-w svg circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.leg .it{padding:9px 0;position:relative}
.leg .it+.it::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--line-2)}
.leg .l{font-size:14px;font-weight:600}
.leg .v{font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.leg .v small{font-size:16px;font-weight:600;color:var(--ink-3);letter-spacing:-.01em}
.leg .s{font-size:12.5px;color:var(--ink-3)}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.tile-km{background:var(--tre);color:var(--on-tre)}
.tile-km .v small,.tile-km .l{color:inherit;opacity:.8}
.wkdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.wkdays span{text-align:center;font-size:11px;font-weight:600;color:var(--ink-3)}
.wkdays i{display:block;height:28px;border-radius:8px;background:var(--fill);margin-bottom:4px}
.wkdays i.on{background:var(--tre)}
.wkdays .td span{color:var(--ink)}
.card.hab-c h2{color:var(--hab)}
.card.tar-c h2{color:var(--tar)}
.card.tre-c h2{color:var(--tre)}
:root:not([data-theme="dark"]) .card.tar-c h2{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card.tar-c h2{color:var(--tar)}}

/* Habits */
.hab-table{overflow-x:auto}
.hab{display:grid;grid-template-columns:minmax(150px,1fr) auto 76px 56px;align-items:center;gap:12px;padding:11px 0;position:relative}
.hab+.hab::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--line-2)}
.hab .name{min-width:0}
.hab .name button{background:none;border:0;padding:0;font-weight:500;font-size:15px;text-align:left;cursor:pointer}
.hab .name button:hover{opacity:.7}
.days{display:grid;grid-template-columns:repeat(14,24px);gap:4px}
.days .dh{font-size:10px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.dcell{width:24px;height:24px;border-radius:50%;border:0;background:var(--fill);padding:0;transition:transform .1s}
.dcell:active{transform:scale(.85)}
.dcell[aria-checked="true"]{background:var(--hc,var(--hab))}
.dcell.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink-3)}
.dcell.pre{opacity:.3}
.goal{display:flex;flex-direction:column;gap:10px}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal .pct{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.goal.done{opacity:.55}
.linked{display:flex;flex-wrap:wrap;gap:6px}
.stepper{display:inline-flex;align-items:center;gap:6px}

/* Calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.cal{background:var(--surface);border-radius:var(--r-tile);overflow:hidden;padding:6px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow div{padding:8px 10px;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cday{position:relative;min-height:104px;padding:6px 6px 12px;border:0;border-radius:14px;background:none;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .12s}
.cday.out .dn{color:var(--ink-3);opacity:.6}
.cday:hover{background:var(--surface-2)}
.cday.sel{background:var(--accent-soft)}
.dn{font-size:14px;font-weight:600;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cday.today .dn{background:var(--bad);color:#fff}
.ci{display:block;font-size:11.5px;font-weight:500;line-height:1.35;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--cc,var(--ink-3)) 16%,transparent);color:var(--ink)}
.ci .mono{font-family:inherit;opacity:.65}
.ci.g{--cc:var(--blue)}
.ci.task{background:none;padding-left:2px;color:var(--ink-2)}
.ci.task::before{content:"";display:inline-block;width:8px;height:8px;border:1.5px solid var(--cc,var(--ink-3));border-radius:50%;margin-right:4px;vertical-align:-1px}
.ci.task.ok{text-decoration:line-through;color:var(--ink-3)}
.more{font-size:11px;color:var(--ink-3);padding-left:4px}
.hbar{position:absolute;left:8px;right:8px;bottom:5px;height:3px;border-radius:2px;background:var(--fill)}
.hbar i{display:block;height:100%;border-radius:2px;background:var(--hab)}
.agenda .it{display:flex;gap:12px;padding:10px 0;align-items:flex-start;position:relative}
.agenda .it+.it::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--line-2)}
.agenda .tm{font-size:13px;color:var(--ink-3);width:42px;flex:none;padding-top:1px;font-variant-numeric:tabular-nums}
.agenda .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--cc,var(--ink-3));flex:none}
.agenda a{color:inherit;text-decoration:none;font-weight:500}
.agenda a:hover{opacity:.7}
.src{font-size:12px;color:var(--ink-3)}

/* Workouts */
.wk-card{display:flex;gap:14px;padding:13px 0;align-items:flex-start;position:relative}
.list+.list .wk-card::before,.wk-card+.wk-card::before{content:"";position:absolute;top:0;left:62px;right:0;height:.5px;background:var(--line-2)}
.wk-date{width:48px;height:48px;flex:none;text-align:center;line-height:1.05;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;justify-content:center}
.wk-date b{display:block;font-size:19px;font-family:var(--f-display);font-weight:700;letter-spacing:-.03em}
.wk-date span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;font-weight:600}
.wk-type{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3)}
.wk-type i{width:8px;height:8px;border-radius:50%}
.exl{font-size:13.5px;color:var(--ink-2);margin-top:4px;display:flex;flex-direction:column;gap:1px}
.exl span b{font-weight:600;color:var(--ink)}
.stats-line{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.stats-line span:first-child{color:var(--ink);font-weight:600}

/* Charts */
.chart{width:100%;min-height:40px}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px}
.hb{display:grid;grid-template-columns:minmax(80px,140px) 1fr 44px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.hb .tr{height:8px;background:var(--fill);border-radius:9px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:9px}
.hb .val{font-size:13px;text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.tbl{margin-top:10px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--blue)}
details.tbl .scroll{overflow-x:auto}
details.tbl table{border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl td,details.tbl th{padding:4px 12px 4px 0;text-align:left;border-bottom:.5px solid var(--line-2);font-weight:400;white-space:nowrap}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);margin-top:10px}
.hm-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 12px}
.sec-h h2{font-size:22px}
.hmaps{margin-bottom:16px}
.hmap .card-h h2{display:flex;align-items:center;gap:8px;min-width:0;font-size:18px}
.hmap .card-h h2 button{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.hmap .card-h h2 button:hover{opacity:.7}
.hm-dot{width:10px;height:10px;border-radius:50%;background:var(--hc);flex:none}
.hm-foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.hm-foot b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.hm-key{margin-left:auto;display:inline-flex;align-items:center;gap:5px}
.hm-key i{width:10px;height:10px;border-radius:2.5px;display:inline-block;background:var(--hc)}
.hm-key i.no{margin-left:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);font:13px/1.4 var(--f-body);padding:8px 11px;border-radius:12px;white-space:pre-line;max-width:260px;box-shadow:var(--shadow)}

/* Edit sheets */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);display:grid;place-items:center;padding:16px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:26px}
.sheet h2{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-bottom:18px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.lbl{font-size:13px;color:var(--ink-3);font-weight:600}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.sheet-foot .r{display:flex;gap:8px;margin-left:auto}
.sheet-foot .btn{padding:10px 20px;font-size:15px}
.sheet .seg{align-self:flex-start}
.ex{background:var(--surface-2);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ex input[type=text],.ex input[type=number]{background:var(--surface)}
.ex .iconbtn{background:var(--surface)}
.ex .btn.ghost{background:none}
.ex-h{display:flex;gap:6px;align-items:center}
.ex-h input{flex:1}
.set{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:6px;align-items:center}
.set .i{font-size:12px;font-weight:600;color:var(--ink-3);text-align:center}
.set input{width:100%}
.conn-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.conn-row b{font-weight:600}
.cat-edit{display:grid;grid-template-columns:1fr 120px 32px;gap:6px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--surface);color:var(--ink);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* Home: rings, widgets, goals, groups, two-week strip */
.bento{margin-bottom:14px}
.w-tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:150px}
.w-tile .wt{font-size:13px;font-weight:600;color:var(--ink-3)}
.tile-km .wt{color:inherit;opacity:.85}
.kpi-btn.tile-km{color:var(--on-tre)}
.kpi-btn{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%;border:0;transition:filter .15s,transform .1s}
.kpi-btn:hover{filter:brightness(1.04)}
.kpi-btn:active{transform:scale(.985)}
.leg .it{display:block;width:100%;background:none;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.leg .it:hover .v{opacity:.75}
.goals-panel{margin-bottom:14px}
.gl{display:flex;flex-direction:column}
.gl-row{display:grid;grid-template-columns:22px minmax(0,1.3fr) minmax(90px,.55fr) minmax(80px,1fr) 52px 100px;gap:14px;align-items:center;padding:12px 0;position:relative}
.gl-row+.gl-row::before{content:"";position:absolute;top:0;left:36px;right:0;height:.5px;background:var(--line-2)}
.gl-n{font-size:13px;font-weight:600;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.gl-tw{display:flex;flex-direction:column;min-width:0}
.gl-t{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:15px;overflow-wrap:anywhere;cursor:pointer}
.gl-t:hover{opacity:.7}
.gl-bar{height:8px;border-radius:9px;background:var(--fill);overflow:hidden}
.gl-bar i{display:block;height:100%;background:var(--gc);border-radius:9px}
.gl-p{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.03em;text-align:right;font-variant-numeric:tabular-nums}
.gl-d{font-size:12.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.gl-d.late{color:var(--bad)}
.home-mid{margin-bottom:14px;align-items:start}
.cg{padding-top:14px;margin-top:10px;position:relative}
.cg::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--line-2)}
.card-h + .cg,.quick + .cg{margin-top:0;padding-top:0}
.card-h + .cg::before,.quick + .cg::before{display:none}
.cg-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.cg-h i{width:10px;height:10px;border-radius:50%;background:var(--gc)}
.cg-h .mono{margin-left:auto;font-family:inherit;font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none}
.cg > .btn.ghost{margin-top:2px;padding-left:0}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.hi{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.hi .main{min-width:0}
.hi .t{background:none;border:0;padding:0;text-align:left;font-weight:500;font-size:15px;cursor:pointer;overflow-wrap:anywhere}
.hi .t:hover{opacity:.7}
.hi .t.hdone{color:var(--ink-3)}
.hi.off{opacity:.5}
.row.compact{padding:9px 0;align-items:center}
.row.compact .check{margin-top:0}
.strip-card .card-h{flex-wrap:wrap;align-items:flex-start}
.strip-card .legend .chip{font-size:12px}
.strip-scroll{overflow-x:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;min-width:870px}
.sd{position:relative;border-radius:16px;padding:10px 8px 16px;min-height:120px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.sd.past{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.sd-h{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0 2px;cursor:pointer;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase}
.sd-h b{font-family:var(--f-display);font-size:19px;color:var(--ink);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sd.today .sd-h b{color:#fff;background:var(--bad);border-radius:50%;width:30px;height:30px;display:inline-grid;place-items:center;font-size:15px;letter-spacing:0}
.sd-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.si{display:block;font:inherit;font-size:11.5px;font-weight:500;line-height:1.35;text-align:left;padding:3px 7px;border-radius:7px;border:0;background:color-mix(in srgb,var(--cc) 16%,var(--surface));color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;width:100%}
.sd.past .si{background:color-mix(in srgb,var(--cc) 12%,transparent)}
.si .mono{font-family:inherit;opacity:.6}
.si:hover{filter:brightness(.97)}
.si.wo{white-space:normal;background:color-mix(in srgb,var(--cc) 22%,var(--surface));box-shadow:inset 3px 0 0 var(--cc);padding-left:9px}
.si.wo b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si.wo span{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.si.tk{background:none!important;padding-left:2px;color:var(--ink-2)}
.si.tk::before{content:"";display:inline-block;width:8px;height:8px;border:1.5px solid var(--cc);border-radius:50%;margin-right:5px;vertical-align:-1px}
.si.tk.ok{text-decoration:line-through;color:var(--ink-3)}
.si.plan{background:none!important;border:1px dashed color-mix(in srgb,var(--cc) 70%,transparent)}
.si.plan span{color:var(--ink-2)}
.si.missed{opacity:.75}.si.missed b{text-decoration:line-through}.si.missed span{color:var(--bad)}
.si.ghost,.ci.ghost{opacity:.6;font-style:italic}
.sd .hbar{bottom:6px;left:9px;right:9px}
.ci.plan{background:none;border:1px dashed color-mix(in srgb,var(--cc) 70%,transparent)}
.ci.plan.missed{text-decoration:line-through;color:var(--ink-3)}

/* Goals linked to tasks and habits */
.tag.goal{color:var(--ink-2);background:var(--fill)}
.goalic{color:var(--blue);font-size:12px;flex:none}
.gparts{display:flex;flex-direction:column;gap:2px;padding-top:10px;position:relative}
.gparts::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--line-2)}
.gp{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px;min-width:0}
.gp .t{background:none;border:0;padding:0;text-align:left;cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp .t:hover{opacity:.7}
.gp.ok .t{text-decoration:line-through;color:var(--ink-3)}
.gp .check{width:20px;height:20px;margin:0}
.gp-h{width:20px;height:20px;border-radius:50%;flex:none;background:conic-gradient(var(--hab) var(--p),var(--fill) 0);-webkit-mask:radial-gradient(farthest-side,transparent 58%,#000 60%);mask:radial-gradient(farthest-side,transparent 58%,#000 60%)}
.gm-auto .gparts{background:var(--surface-2);border-radius:16px;padding:12px 14px}
.gm-auto .gparts::before{display:none}
.gparts .btn{align-self:flex-start;margin-top:4px;padding-left:0}
.hist{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.hp{font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--fill);color:var(--ink-3);font-variant-numeric:tabular-nums}
.hp.ok{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}

/* Repetition fields */
.recbox{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;background:var(--surface-2)}
.recbox input[type=number],.recbox input[type=date],.recbox select{background:var(--surface)}
.wdays{display:flex;flex-wrap:wrap;gap:6px}
.wd{position:relative;cursor:pointer}
.wd input{position:absolute;opacity:0;pointer-events:none}
.wd span{display:inline-grid;place-items:center;min-width:46px;height:34px;padding:0 10px;border-radius:99px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink);transition:background .15s}
.wd input:checked + span{background:var(--accent);color:var(--accent-ink)}
.wd input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.rec-sum{margin:0;font-size:13px;color:var(--ink-2);font-weight:600}
.rec-sum:empty{display:none}
.tag.rec{color:var(--ink-2);background:var(--accent-soft)}
.recic{color:var(--ink-3);font-size:13px;flex:none}
.dcell.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2);opacity:.7}
.dcell.off[aria-checked="true"]{opacity:1;box-shadow:none;background:var(--hc,var(--hab))}
.plan-row{align-items:center}
.plan-row.paused{opacity:.55}
.pdot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:0}
@media (max-width:1100px){
  .bento{align-items:stretch}
  .gl-row{grid-template-columns:22px minmax(0,1fr) auto;row-gap:6px}
  .gl-n{grid-area:1/1}.gl-tw{grid-area:1/2}.gl-p{grid-area:1/3}.gl-c{grid-area:2/2}.gl-d{grid-area:2/3}.gl-bar{grid-area:3/2/4/4}
}
@media (max-width:900px){.hgrid{grid-template-columns:1fr}}
@media (max-width:620px){.rings-w .leg .it{text-align:center}.w-tile{min-height:0}}
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal-wrap{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .side{grid-template-columns:auto 1fr auto}
  .nav{justify-self:center}
  .nav button{padding:6px 10px}
  .conn span em{display:none}
}
@media (max-width:900px){
  .side{grid-template-columns:1fr auto;padding-bottom:10px;-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
  .side .nav{position:fixed;left:0;right:0;bottom:0;justify-self:stretch;z-index:45;border-radius:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 85%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid var(--line-2);justify-content:space-around}
  .nav button{flex-direction:column;gap:3px;padding:5px 2px;font-size:10.5px;flex:1;align-items:center;text-align:center;color:var(--ink-3);background:none!important;box-shadow:none!important}
  .nav button svg{display:block;width:24px;height:24px}
  .nav button[aria-current="page"]{color:var(--blue);font-weight:600}
  main{padding-block:10px 110px}
  .grid2,.grid3{grid-template-columns:1fr}
  h1{font-size:34px}
  .cday{min-height:58px;padding:4px;border-radius:10px}
  .cday .ci{display:none}
  .cday .more{display:none}
  .cday .dots{display:flex}
  .hab{grid-template-columns:1fr auto;row-gap:8px}
  .hab .days{grid-column:1/-1;order:3}
  .modal{place-items:end center;padding:0}
  .sheet{width:100%;border-radius:28px 28px 0 0;max-height:92%;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:620px){
  .bento{grid-template-columns:1fr}
  .bento .span2{grid-column:auto}
  .rings-w{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px}
  .rings-w .leg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
  .rings-w .leg .it+.it::before{display:none}
  .kpis{gap:10px}
  .conn{display:none}
}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--cc,var(--ink-3))}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:pop .28s cubic-bezier(.2,.9,.25,1)}
  @keyframes pop{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal{animation:fade .2s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
@media (prefers-reduced-motion:reduce){.rings-w svg circle{transition:none}}


/* ============ Design 2026 · Figma "compass" (tela de Início) ============
   Tudo abaixo vale para todas as telas: tipografia, barra do topo, pílulas, cartões. */
body{font-family:var(--f-body);font-weight:500;letter-spacing:0;font-variant-numeric:lining-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
.n{font-family:var(--f-num);font-weight:500}
.leg .v,.kpi .v,.goal .pct,.gl-p,.wk-date b,.sd-h b,.dn,.streak b,.mono,.num,.days .dh,.hb .val,.gl-d,.hp,.km-v{font-family:var(--f-num)}
.chart text{font-family:var(--f-num)}
.mono{font-size:.9em}
.goalic{color:var(--ink-3)}

/* Barra do topo: logo à esquerda, navegação em pílula no centro */
.side{--gut:clamp(16px,3.5vw,44px);padding:24px max(var(--gut),calc((100% - 1340px)/2 + var(--gut))) 14px;background:color-mix(in srgb,var(--bg) 90%,transparent)}
.brand img{display:block;height:39px;width:auto}
:root[data-theme="dark"] .brand img{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand img{filter:invert(1)}}
.nav{gap:2px;padding:4px;border-radius:20px;background:var(--surface);border:1px solid var(--pill-line);box-shadow:var(--card-shadow)}
.nav button{min-height:23px;padding:3px 15px;border-radius:20px;font-size:13px;font-weight:600;color:var(--ink)}
.nav button:hover{background:var(--fill)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:600;box-shadow:none}
.conn,.side-foot .btn{background:var(--surface);border:1px solid var(--pill-line);box-shadow:var(--pill-shadow)}
.conn{padding:6px 10px}
.side-foot .btn{padding:4px 12px}
.side-foot .theme-t{width:32px;padding:0;justify-content:center}
.side-foot .theme-t svg{width:16px;height:16px;flex:none}

/* Cabeçalho das telas: título · subtítulo, ações em pílula */
main{max-width:1340px;padding-block:6px 64px}
.vh{align-items:center;margin:22px 0 20px}
.vh-t{display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;min-width:0}
h1{font-size:38px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.vh-dot{width:6px;height:6px;border-radius:50%;background:var(--ink);flex:none}
.vh-sub{margin:0;font-size:25px;font-weight:600;line-height:1.3}

/* Botões em pílula: branco com sombra fina; o principal é preto */
.btn{gap:4px;min-height:25px;padding:4px 13px;border-radius:20px;border:1px solid var(--pill-line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;box-shadow:var(--pill-shadow)}
.btn svg{width:11px;height:11px}
.btn:hover{filter:none;background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{filter:none;background:var(--ink);opacity:.85}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--ink-3);font-weight:600}
.btn.ghost:hover{background:none;color:var(--ink)}
.btn.danger{background:none;border-color:transparent;box-shadow:none}
.btn.danger.armed{background:var(--bad);color:#fff}
.sheet .btn:not(.primary):not(.ghost):not(.danger),.card .btn:not(.primary):not(.ghost):not(.danger){background:var(--surface)}
.sheet-foot .btn{padding:8px 20px;font-size:14px}
.iconbtn{background:var(--surface);border:1px solid var(--pill-line);box-shadow:var(--pill-shadow)}
.vh .iconbtn{background:var(--surface)}
.fchip{border:1px solid var(--pill-line);box-shadow:var(--pill-shadow);font-weight:600}
.fchip[aria-pressed="true"]{border-color:var(--ink)}
.seg button{font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}

/* Cartões: branco, borda #F1F1F1, cantos 15px, sombra de 6px */
.card,.kpi,.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile);box-shadow:var(--card-shadow)}
.card{padding:22px 26px}
.card-h h2{font-size:22px}
.kpi.solid,[data-area="treinos"] .kpis .kpi:first-child{background:var(--surface);color:var(--ink)}
.kpi.solid .v small,.kpi.solid .l,[data-area="treinos"] .kpis .kpi:first-child .v small,[data-area="treinos"] .kpis .kpi:first-child .l{color:var(--ink-3);opacity:1}
.kpi.solid .meter,[data-area="treinos"] .kpis .kpi:first-child .meter{background:var(--fill)}
.kpi.solid .meter i,[data-area="treinos"] .kpis .kpi:first-child .meter i{background:var(--tre)}
.meter{height:6px;border-radius:20px}
.meter i{border-radius:20px}
.empty{border-radius:12px}
.banner{border-radius:12px}
.tip,.toast{border:1px solid var(--line)}
.cday.today .dn,.sd.today .sd-h b{background:var(--ink);color:var(--bg)}
.dcell.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}

/* Folhas de edição */
.sheet{border-radius:20px}
.sheet h2{font-size:26px;letter-spacing:-.01em}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{font-weight:500}

/* Início */
.bento{grid-template-columns:minmax(0,1.53fr) minmax(0,1fr) minmax(0,1fr);gap:20px;margin-bottom:28px}
.bento > *{min-height:243px}
.rings-w{padding:14px 26px}
.leg .l{font-size:13px;font-weight:700}
.leg .v{font-size:30px;font-weight:700;letter-spacing:-.02em}
.leg .s{font-size:12px;font-weight:500}
.w-tile .wt{font-size:14px;font-weight:600}
.tile-t{font-size:30px;line-height:1.2;max-width:6.6em;text-wrap:wrap}
.km-tile{width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;align-items:flex-start;justify-content:space-between;transition:transform .1s}
.km-tile:hover{background:var(--surface-2)}
.km-tile:active{transform:scale(.99)}
.km-v{font-weight:700;font-size:34px;line-height:1;color:var(--hab);letter-spacing:-.01em;margin-bottom:8px}
.km-v b{font-size:72px;font-weight:700;letter-spacing:-.04em}
.week-tile{justify-content:space-between}
.week-tile .wkdays{margin-top:0}
.wkdays{gap:7px}
.wkdays i{height:24px;border-radius:6px}
.goals-panel{padding:24px 38px 16px;margin-bottom:28px}
.goals-panel .card-h{margin-bottom:10px}
.goals-panel .card-h h2{font-size:30px}
.gl-row{grid-template-columns:6px minmax(0,1.55fr) minmax(110px,.72fr) minmax(120px,1.25fr) 52px;column-gap:28px;padding:14px 0;align-items:baseline}
.gl-row{padding:16px 0}
.gl-row+.gl-row::before{left:0;height:1px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.gl-dot{width:6px;height:6px;border-radius:50%;background:var(--ink);align-self:start;margin-top:12px}
.gl-t{font-size:20px;font-weight:600;line-height:1.3}
.gl-meta{margin-top:3px;font-size:13px;font-weight:600;line-height:1.45;color:var(--ink-3)}
.gl-meta span+span::before{content:"·";margin:0 7px}
.gl-meta svg{width:12px;height:12px;vertical-align:-1.5px;margin-right:4px}
.gl-c{font-size:16px;font-weight:700;color:var(--gc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl-bar{height:6px;border-radius:20px;background:var(--fill);align-self:start;margin-top:12px}
.gl-bar i{border-radius:20px}
.gl-p{font-size:16px;font-weight:600;color:var(--gc);text-align:left;letter-spacing:0}
.gl-p.none{color:var(--ink-3)}

@media (max-width:1100px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bento .rings-w{grid-column:1/-1}
  .gl-row{grid-template-columns:6px minmax(0,1fr) auto;row-gap:8px}
  .gl-dot{grid-area:1/1}.gl-tw{grid-area:1/2}.gl-p{grid-area:1/3}.gl-c{grid-area:2/2}.gl-bar{grid-area:3/2/4/4;margin-top:2px}
}
@media (max-width:900px){
  .side{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--bg)}
  .brand img{height:30px}
  .side .nav{gap:0;border:0;border-top:.5px solid var(--line-2);border-radius:0;box-shadow:none;background:color-mix(in srgb,var(--surface) 92%,transparent)}
  .nav button{min-height:0;padding:5px 2px;border-radius:0;font-size:10.5px;color:var(--ink-3)}
  .nav button[aria-current="page"]{color:var(--ink);font-weight:700}
  main{padding-block:6px 110px}
  h1{font-size:30px}
  .vh-sub{font-size:19px}
  .goals-panel{padding:20px}
  .goals-panel .card-h h2{font-size:26px}
  .gl-t{font-size:17px}
  .sheet{border-radius:20px 20px 0 0}
}
@media (max-width:620px){
  .bento{grid-template-columns:1fr}
  .bento > *{min-height:0}
  .vh-dot{display:none}
  .vh-t{flex-direction:column;align-items:flex-start}
}
/* ===== Redesign v2 (PDFs Tela inicial, Hábitos, Tarefas, Treinos) ===== */
/* pílulas de prazo */
.due{display:inline-block;height:21px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;line-height:21px;color:#fff;white-space:nowrap;vertical-align:middle}
.due .n{font-weight:700}
.due.sm{height:18px;padding:0 8px;font-size:11px;line-height:18px}
.due-red{background:var(--due-red)} .due-yellow{background:var(--due-yellow)} .due-green{background:var(--due-green)}
.prio.p1{color:var(--due-red)}
/* títulos dos cartões do Início no tamanho do design */
[data-area="hoje"] .card-h h2{font-size:30px}
.home-mid .card,.strip-card{padding:24px 30px}
.home-mid .card-h,.strip-card .card-h{margin-bottom:14px}
/* Início · Hábitos */
.hg{margin-top:20px}
.home-hab .card-h + .hg{margin-top:4px}
.hg-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.hg-h i{width:12px;height:12px;border-radius:50%;background:var(--gc);flex:none;margin-right:8px}
.hg-n{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.3;color:var(--gc)}
.hg-c{font-size:11px;font-weight:600;color:var(--gc)}
.hl{display:flex;align-items:flex-start;gap:9px;padding:4px 0 4px 26px;min-width:0;font-size:19px;line-height:1.35}
.hl-b{flex:1;min-width:0}
.hl-ck{position:relative;flex:none;width:13px;height:13px;margin-top:calc((1.35em - 13px)/2);padding:0;border-radius:50%;border:1.5px solid var(--ink);background:none;transition:background .15s,border-color .15s}
.hl-ck::after{content:"";position:absolute;inset:-9px}
.hl-ck:hover{border-color:var(--gc)}
.hl-ck[aria-checked="true"]{background:var(--gc);border-color:var(--gc)}
.hl-t{display:inline;padding:0;border:0;background:none;font-size:1em;font-weight:500;line-height:inherit;color:var(--ink);text-align:left;cursor:pointer;overflow-wrap:anywhere}
.hl-t:hover{opacity:.7}
.hl-s{display:inline-block;margin-left:9px;font-size:12px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.hl-s::before{content:"•";margin-right:9px;color:var(--ink)}
.hl-g{display:inline-block;margin-left:9px;font-size:13px;line-height:1;color:var(--gc)}
/* Início e Tarefas · linhas de tarefa */
.home-tar .row .t,.row .t{font-size:16px}
.home-tar .cg{margin-top:14px}
/* Hábitos & metas · cartões de meta */
.gcat{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--gc)}
.gcat i{width:8px;height:8px;border-radius:50%;background:var(--gc)}
.gtitle{margin-top:6px;font-size:15px;line-height:1.3}
.gtitle button{padding:0;border:0;background:none;font:inherit;color:var(--gc);text-align:left;cursor:pointer}
.gtitle button:hover{opacity:.75}
.gval{flex-basis:100%;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.gval b{font-family:var(--f-num);font-size:clamp(16px,1.35vw,20px);font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.gval .btn.ghost{margin-left:auto;padding-right:0}
.goal .gadd{align-self:flex-start;padding-left:0}
.tag.rec svg{width:11px;height:11px;vertical-align:-1.5px;margin-right:3px}
/* Treinos · números coloridos */
.kpis-cor .k-blue .v{color:var(--k-blue)} .kpis-cor .k-red .v{color:var(--k-red)} .kpis-cor .k-lime .v{color:var(--k-lime)} .kpis-cor .k-indigo .v{color:var(--k-indigo)}
.kpis-cor .kpi .v small{color:var(--ink-3)}
.kpis-cor .k-blue .meter i{background:var(--tre)}
@media (max-width:900px){[data-area="hoje"] .card-h h2{font-size:26px}.hg-n{font-size:20px}.hl{font-size:17px}}

/* ===== Movimento (3 durações, 3 curvas) =====
   rápido 120ms: resposta ao toque · base 240ms: mudança de estado · lento 420ms: espaço e telas */
:root{--m-fast:120ms;--m-base:240ms;--m-slow:420ms;--ez:cubic-bezier(.2,.8,.2,1);--ez-in:cubic-bezier(.4,0,1,1);--ez-sheet:cubic-bezier(.32,.72,0,1)}
@media (prefers-reduced-motion:reduce){:root{--m-fast:1ms;--m-base:1ms;--m-slow:1ms}}
/* resposta ao toque */
.iconbtn,.fchip,.seg button,.nav button,.rings-w .it,.km-tile,.dcell,.hl-ck,.check{transition:transform var(--m-fast) var(--ez),background-color var(--m-base) var(--ez),border-color var(--m-base) var(--ez),color var(--m-base) var(--ez),box-shadow var(--m-base) var(--ez),filter var(--m-fast)}
.iconbtn:active,.fchip:active,.seg button:active,.nav button:active{transform:scale(.94)}
.km-tile:active,.rings-w .it:active{transform:scale(.98)}
.hl-ck:active{transform:scale(.8)}
/* check da tarefa: o traço se desenha; ao concluir, o título é riscado antes de a linha sair */
.check svg{opacity:1}
.check svg *{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset var(--m-base) var(--ez) 60ms}
.check[aria-checked="true"] svg *,.just-done .check svg *{stroke-dashoffset:0}
.just-done .check{background:var(--accent);border-color:var(--accent)}
.row .t,.gp .t{background:linear-gradient(currentColor,currentColor) no-repeat 0 56%/0 1.5px;transition:background-size var(--m-slow) var(--ez),color var(--m-base),opacity var(--m-fast)}
.just-done .t{background-size:100% 1.5px;color:var(--ink-3)}
/* barras e anéis acompanham o valor */
.gl-bar i,.meter i{transition:width var(--m-slow) var(--ez)}
/* marcador da navegação (computador): desliza entre os itens */
.nav{position:relative}
.nav-ind{position:absolute;left:0;top:4px;bottom:4px;width:0;border-radius:20px;background:var(--ink);pointer-events:none;z-index:0}
.nav button{position:relative;z-index:1}
.nav.has-ind button[aria-current="page"]{background:none}
@media (max-width:900px){.nav-ind{display:none}}
/* troca de tela */
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(main){animation:m-out-f .16s var(--ez-in) both}
::view-transition-new(main){animation:m-in-f .38s var(--ez) both}
:root[data-dir="back"]::view-transition-old(main){animation-name:m-out-b}
:root[data-dir="back"]::view-transition-new(main){animation-name:m-in-b}
::view-transition-group(nav-ind){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,1.25,.5,1)}
@keyframes m-out-f{to{opacity:0;transform:translateX(-14px)}}
@keyframes m-in-f{from{opacity:0;transform:translateX(22px)}}
@keyframes m-out-b{to{opacity:0;transform:translateX(14px)}}
@keyframes m-in-b{from{opacity:0;transform:translateX(-22px)}}
/* formulários: saem do jeito que entraram */
.modal.closing{animation:m-fade-out .21s var(--ez-in) forwards;pointer-events:none}
.modal.closing .sheet{animation:m-sheet-out .21s var(--ez-in) forwards}
@keyframes m-fade-out{to{opacity:0}}
@keyframes m-sheet-out{to{opacity:0;transform:translateY(14px) scale(.98)}}
@media (max-width:900px){
  .sheet{animation:m-sheet-up .44s var(--ez-sheet)}
  .modal.closing .sheet{animation:m-sheet-down .26s var(--ez-in) forwards}
  @keyframes m-sheet-up{from{transform:translateY(100%)}}
  @keyframes m-sheet-down{to{transform:translateY(100%)}}
}
@media (prefers-reduced-motion:reduce){.sheet,.modal,.modal.closing,.modal.closing .sheet{animation:none}}
/* aviso com ação */
.toast{display:flex;align-items:center;gap:14px}
.toast-act{flex:none;margin:-5px -8px -5px 0;padding:5px 12px;border:0;border-radius:99px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.toast-act:active{transform:scale(.95)}
@media (max-width:900px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
/* toque: área de pelo menos 44px nos círculos de marcar */
.check{position:relative}
@media (pointer:coarse){
  .hl-ck::after{inset:-16px -16px -16px -12px}
  .check::after{content:"";position:absolute;inset:-10px}
}
/* Início no celular: o que fazer hoje vem antes dos indicadores */
@media (max-width:900px){
  #main[data-area="hoje"]{display:flex;flex-direction:column}
  #main[data-area="hoje"]>*{order:4;margin-top:0;margin-bottom:14px}
  #main[data-area="hoje"]>.banner{order:0}
  #main[data-area="hoje"]>.vh{order:1;margin-bottom:18px}
  #main[data-area="hoje"]>.home-mid{order:2}
  #main[data-area="hoje"]>.bento{order:3}
}

/* ===== Refinamento visual ===== */
/* estados vazios: ícone, título, explicação e próximo passo */
.empty{display:flex;flex-direction:column;align-items:center;gap:5px;padding:30px 20px;border-radius:18px;background:var(--surface-2);color:var(--ink-3);text-align:center;font-size:13.5px;line-height:1.45}
.empty br{display:none}
.empty .e-ic{display:grid;place-items:center;width:42px;height:42px;margin-bottom:6px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--card-shadow)}
.empty .e-ic svg{width:19px;height:19px}
.empty .e-t{font-size:15.5px;font-weight:600;color:var(--ink)}
.empty .e-s{max-width:44ch}
.empty .btn{margin-top:10px}
/* Tarefas: Abertas/Concluídas no fim da linha de filtros; categorias vazias recolhidas */
[data-area="tarefas"] .filters{align-items:center;margin-bottom:18px}
[data-area="tarefas"] .filters .seg{margin-left:auto}
.task-board .task-list-card{background:var(--surface);box-shadow:var(--card-shadow)}
.task-empty-cats{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:13px;color:var(--ink-3)}
.task-empty-cats>span:first-child{margin-right:4px}
.task-empty-cats .fchip{padding:5px 11px;font-size:13px;background:none}
.task-empty-cats .fchip svg{width:13px;height:13px;color:var(--ink-3)}
.task-empty-cats button.fchip:hover{background:var(--surface)}
/* Treinos: mostrar mais semanas */
.more-btn{display:flex;margin:14px auto 2px;gap:8px}
.more-btn .muted{font-weight:500}
/* Resumo: cor da área nos números */
.kpis-cor .k-hab .v{color:var(--hab)} .kpis-cor .k-tar .v{color:var(--tar)} .kpis-cor .k-tre .v{color:var(--tre)}
/* Agenda: legenda */
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:12px 6px 2px;font-size:12px;color:var(--ink-3)}
.cal-legend span{display:inline-flex;align-items:center;gap:7px}
.cal-legend i{display:inline-block;flex:none}
.lg-hbar{width:22px;height:3px;border-radius:2px;background:var(--fill)}
.lg-hbar b{display:block;width:60%;height:100%;border-radius:2px;background:var(--hab)}
.lg-plan{width:18px;height:10px;border-radius:4px;border:1px dashed var(--ink-3)}
.hbar{cursor:default}
/* formulário de tarefa: opções avançadas recolhidas */
.more-opts{border-top:1px solid var(--line);padding-top:12px}
.more-opts summary{display:flex;align-items:baseline;gap:8px;cursor:pointer;list-style:none;font-size:14px;font-weight:600;color:var(--ink)}
.more-opts summary::-webkit-details-marker{display:none}
.more-opts summary::before{content:"";width:7px;height:7px;flex:none;align-self:center;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform var(--m-base) var(--ez)}
.more-opts[open] summary::before{transform:rotate(45deg) translate(-2px,-2px)}
.more-opts summary span{font-size:12.5px;font-weight:500;color:var(--ink-3)}
.more-opts[open] summary span{display:none}
.more-body{display:flex;flex-direction:column;gap:14px;margin-top:14px}
@media (prefers-reduced-motion:no-preference){.more-opts[open] .more-body{animation:m-reveal var(--m-slow) var(--ez)}}
@keyframes m-reveal{from{opacity:0;transform:translateY(-6px)}}
</style>

<link rel="stylesheet" href="compasso-motion.css">
<div class="app">
  <nav class="side" aria-label="Seções">
    <div class="brand">
      <img src="logo.svg" alt="Compasso">
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">

<!-- Adaptador local: substitui o runtime do claude.ai (dados + conectores) -->
<script src="config.js"></script>
<script src="compasso-shim.js"></script>
<script>
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addD=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const today=()=>dk(new Date());
const monOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addD(x,-((x.getDay()+6)%7))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESF=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW=['seg','ter','qua','qui','sex','sáb','dom'];
const DOWF=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const nf=(n,dg=0)=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:dg,maximumFractionDigits:dg});
const fmtD=s=>{const d=pd(s);return `${d.getDate()} ${MES[d.getMonth()]}`};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const secFmt=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`};
const parseTime=str=>{if(!str)return 0;const p=String(str).trim().split(':').map(Number);if(p.some(isNaN))return 0;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60};
const paceFmt=(sec,km)=>km>0?secFmt(sec/km)+'/km':'–';
const I={
  today:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  habits:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>',
  tasks:'<rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M8 12.2l2.8 2.8 5.2-6"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  work:'<path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/>',
  stats:'<path d="M3 20.5h18M6 17V11M11 17V5M16 17v-8M21 17v-4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',
  sync:'<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 13a8 8 0 0 0 14.3 4.9L20 16M4 4v4h4M20 20v-4h-4"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
};
const ic=(n,w=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const CHECK=ic('check',3);

/* ============ recurrence ============ */
const hasRec=r=>!!(r&&r.freq&&r.freq!=='none');
function occursOn(r,key){
  if(!hasRec(r)||!r.start)return false;
  if(key<r.start||(r.until&&key>r.until))return false;
  const ev=Math.max(1,+r.every||1);const d=pd(key),s=pd(r.start);
  if(r.freq==='daily')return daysBetween(r.start,key)%ev===0;
  if(r.freq==='weekly'){const wd=(d.getDay()+6)%7;const days=r.days&&r.days.length?r.days:[(s.getDay()+6)%7];if(!days.includes(wd))return false;return Math.round((monOf(d)-monOf(s))/(7*864e5))%ev===0}
  if(r.freq==='monthly'){const md=(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth();if(md%ev)return false;const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(s.getDate(),last)}
  return false;
}
function nextOcc(r,afterKey){if(!hasRec(r))return null;let d=addD(pd(afterKey),1);for(let i=0;i<800;i++){const k=dk(d);if(r.until&&k>r.until)return null;if(occursOn(r,k))return k;d=addD(d,1)}return null}
function recLabel(r){
  if(!hasRec(r))return '';const ev=+r.every||1;
  if(r.freq==='daily')return ev===1?'todo dia':`a cada ${ev} dias`;
  if(r.freq==='weekly'){const days=(r.days&&r.days.length?r.days:[(pd(r.start||today()).getDay()+6)%7]).slice().sort((a,b)=>a-b).map(i=>DOW[i]).join(', ');return (ev===1?'toda ':`a cada ${ev} semanas · `)+days}
  if(r.freq==='monthly')return `${ev===1?'todo mês':`a cada ${ev} meses`}, dia ${pd(r.start||today()).getDate()}`;
  return '';
}
function recFields(p,r,o={}){
  const allowNone=o.allowNone!==false;
  r=r||{freq:allowNone?'none':'weekly',every:1,days:[],start:o.start||today(),until:''};
  const f=r.freq||'none';
  return `<div class="recbox" data-rec="${p}" ${o.hideStart?'data-nostart="1"':''}>
   <div class="frow"><div class="field"><label for="${p}-freq">${o.label||'Repetir'}</label><select id="${p}-freq">
     ${allowNone?`<option value="none" ${f==='none'?'selected':''}>Não repete</option>`:''}
     <option value="daily" ${f==='daily'?'selected':''}>A cada N dias</option>
     <option value="weekly" ${f==='weekly'?'selected':''}>Semanal · dias escolhidos</option>
     <option value="monthly" ${f==='monthly'?'selected':''}>Mensal · mesmo dia</option></select></div>
   <div class="field" data-show="daily,weekly,monthly"><label for="${p}-every" id="${p}-everyl">Intervalo</label><input type="number" id="${p}-every" min="1" max="52" value="${r.every||1}"></div></div>
   <div class="field" data-show="weekly"><span class="lbl">Dias da semana</span><div class="wdays">${DOW.map((d,i)=>`<label class="wd"><input type="checkbox" id="${p}-d${i}" ${(r.days||[]).includes(i)?'checked':''}><span>${d}</span></label>`).join('')}</div></div>
   <div class="frow" data-show="daily,weekly,monthly">${o.hideStart?'':`<div class="field"><label for="${p}-start">${o.startLabel||'Começa em'}</label><input type="date" id="${p}-start" value="${esc(r.start||o.start||today())}"></div>`}<div class="field"><label for="${p}-until">Termina em (opcional)</label><input type="date" id="${p}-until" value="${esc(r.until||'')}"></div></div>
   <p class="rec-sum" id="${p}-sum" data-show="daily,weekly,monthly"></p></div>`;
}
function readRec(p){
  const f=fv(p+'-freq');if(!f||f==='none')return {freq:'none'};
  const days=[0,1,2,3,4,5,6].filter(i=>{const el=document.getElementById(`${p}-d${i}`);return el&&el.checked});
  return {freq:f,every:clamp(+fv(p+'-every')||1,1,52),days:f==='weekly'?days:[],start:fv(p+'-start')||'',until:fv(p+'-until')||''};
}
function syncRec(p){
  const box=document.querySelector(`[data-rec="${p}"]`);if(!box)return;
  const f=fv(p+'-freq')||'none';
  box.querySelectorAll('[data-show]').forEach(el=>el.hidden=!el.dataset.show.split(',').includes(f));
  const l=document.getElementById(p+'-everyl');if(l)l.textContent=f==='daily'?'A cada quantos dias':f==='weekly'?'A cada quantas semanas':'A cada quantos meses';
  const r=readRec(p);if(!r.start)r.start=fv('f-due')||fv('w-date')||today();
  const s=document.getElementById(p+'-sum');if(s){const nx=occursOn(r,today())?today():nextOcc(r,today());s.textContent=hasRec(r)?`↻ ${recLabel(r)}${nx?` · próxima: ${nx===today()?'hoje':fmtD(nx)}`:' · sem próximas datas'}`:''}
}
const syncAllRec=()=>document.querySelectorAll('#sheet [data-rec]').forEach(b=>syncRec(b.dataset.rec));

/* goal periods */
const PERN={weekly:'semanal',monthly:'mensal',quarterly:'trimestral',yearly:'anual'};
const isPer=g=>!!(g&&g.period&&g.period!=='none');
function perRange(p,date=new Date()){
  const y=date.getFullYear(),m=date.getMonth();
  if(p==='weekly'){const s=monOf(date);return {key:dk(s),start:dk(s),end:dk(addD(s,6)),label:fmtD(dk(s))}}
  if(p==='monthly')return {key:`${y}-${pad(m+1)}`,start:dk(new Date(y,m,1)),end:dk(new Date(y,m+1,0)),label:MES[m]};
  if(p==='quarterly'){const q=Math.floor(m/3);return {key:`${y}-Q${q+1}`,start:dk(new Date(y,q*3,1)),end:dk(new Date(y,q*3+3,0)),label:`${q+1}º tri`}}
  return {key:String(y),start:`${y}-01-01`,end:`${y}-12-31`,label:String(y)};
}
const prevPer=(p,r)=>perRange(p,addD(pd(r.start),-1));
const gCur=g=>isPer(g)?(+((g.prog||{})[perRange(g.period).key])||0):(+g.current||0);
const gDeadline=g=>isPer(g)?perRange(g.period).end:g.deadline;

/* workout plans */
function planDone(p,key){return S.workouts.some(w=>calendarOn(w,key)&&(w.planId===p.id||(!w.planId&&w.type===p.type)))}
const activePlans=()=>(S.plans||[]).filter(p=>p.active!==false&&hasRec(p.rec));
const plannedOn=key=>activePlans().filter(p=>occursOn(p.rec,key)&&!planDone(p,key));
const taskGhosts=key=>S.tasks.filter(x=>!x.done&&hasRec(x.rec)&&x.due&&key>x.due&&occursOn(x.rec,key));

/* ============ state ============ */
const S={cats:[],settings:{workoutTarget:4},habits:[],goals:[],tasks:[],workouts:[],events:[],plans:[],logs:{},loaded:{}};
const UI={view:'hoje',calMonth:null,calSel:today(),taskCat:'all',taskShow:'open',exSel:'',draft:null};
let db=null,mcp=null,dbState='wait';
const G={month:{key:'',events:[],err:null,at:0,unsub:null,loading:false},soon:{key:'',events:[],err:null,at:0,unsub:null,loading:false}};
const SV={busy:false,msg:'',err:null,at:0,auto:false};
{const t=new Date();UI.calMonth=new Date(t.getFullYear(),t.getMonth(),1);}

const catList=()=>S.cats.length?S.cats:[{id:'geral',name:'Geral',c:8}];
const catOf=id=>catList().find(c=>c.id===id)||{id:'',name:'Sem categoria',c:0};
const cv=c=>c?(typeof c==='string'?`var(--${c})`:`var(--c${c})`):'var(--ink-3)';
const catChip=id=>{const c=catOf(id);return `<span class="chip"><i style="background:${cv(c.c)}"></i>${esc(c.name)}</span>`};

/* ============ persistence ============ */
const Q={};
function queue(path,fn){Q[path]=(Q[path]||Promise.resolve()).then(fn).catch(e=>dbFail(e));return Q[path]}
function dbFail(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')toast('Limite de armazenamento atingido. Exclua itens antigos para salvar novos.');
  else if(c==='server_unavailable'&&window.CompassoLocal&&window.CompassoLocal.server)toast('Servidor do Compasso fora do ar: a alteração não foi salva.');
  else if(c==='invalid_argument')toast('Não foi possível salvar: esta visualização não tem permissão de escrita.');
  else toast('Falha ao salvar. Tente de novo em instantes.');
}
function put(col,id,data){
  const arr=S[col];const i=arr.findIndex(x=>x.id===id);const rec={id,...data};
  if(i>=0)arr[i]=rec;else arr.push(rec);
  schedule();
  if(db)return queue(col+'/'+id,()=>db.doc(col+'/'+id).set(data));
}
function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);schedule();
  if(db)return queue(col+'/'+id,()=>db.doc(col+'/'+id).delete());
}
function putMeta(name,data){
  if(name==='categories')S.cats=data.items;else S.settings=data;
  schedule();
  if(db)queue('meta/'+name,()=>db.doc('meta/'+name).set(data));
}
const strip=o=>{const {id,...r}=o;return r};

/* ============ habits ============ */
const activeHabits=()=>S.habits.filter(h=>!h.archived).sort((a,b)=>(a.order??0)-(b.order??0)||String(a.createdAt).localeCompare(String(b.createdAt)));
function doneOn(hid,key){const l=S.logs[key.slice(0,7)];return !!(l&&l.days&&(l.days[key]||[]).includes(hid))||autoW(hid,key).length>0}
/* hábitos marcados por treinos (Strava ou registrados à mão): calculado, não gravado no habitlog */
const AUTOW=[['','Não, marco à mão'],['any','Qualquer treino'],['run','Corrida'],['strength','Musculação'],['other','Outros treinos']];
let WD={src:null,n:-1,map:new Map()};
function wDays(){
  if(WD.src!==S.workouts||WD.n!==S.workouts.length){const m=new Map();S.workouts.forEach(w=>{if(w.date){if(!m.has(w.date))m.set(w.date,[]);m.get(w.date).push(w)}});WD={src:S.workouts,n:S.workouts.length,map:m}}
  return WD.map;
}
function autoW(hid,key){
  const h=S.habits.find(x=>x.id===hid);if(!h||!h.autoW||key<hStart(h)||key>today())return [];
  return (wDays().get(key)||[]).filter(w=>h.autoW==='any'||w.type===h.autoW);
}
function toggleHabit(hid,key){
  const aw=autoW(hid,key);if(aw.length){toast(`Marcado pelo treino “${aw[0].title||'treino'}”. Para marcar só à mão, edite o hábito.`);return}
  const hb=S.habits.find(h=>h.id===hid);const gid=hb&&hb.goalId;const gb=goalOf(gid)?goalProg(goalOf(gid)):undefined;
  const ym=key.slice(0,7);const cur=S.logs[ym]||{days:{}};
  const days={...(cur.days||{})};let arr=[...(days[key]||[])];
  arr=arr.includes(hid)?arr.filter(x=>x!==hid):[...arr,hid];
  if(arr.length)days[key]=arr;else delete days[key];
  S.logs[ym]={days};schedule();
  if(db)queue('habitlog/'+ym,()=>db.doc('habitlog/'+ym).set({days}));
  const fb=goalFeedback(gid,gb);if(fb)toast(fb);
}
const hStart=h=>h.createdAt?String(h.createdAt).slice(0,10):'2000-01-01';
function weekCount(h,mon){let n=0;for(let i=0;i<7;i++){if(doneOn(h.id,dk(addD(mon,i))))n++}return n}
const isSched=(h,key)=>h.freq==='sched'?occursOn(h.rec,key):h.freq!=='weekly';
function streak(h){
  const t=new Date();
  if(h.freq==='weekly'){
    let mon=monOf(t),n=0;const tg=h.target||1;
    if(weekCount(h,mon)<tg)mon=addD(mon,-7);
    while(weekCount(h,mon)>=tg&&n<520){n++;mon=addD(mon,-7)}
    return {n,unit:n===1?'semana':'semanas'};
  }
  const st=hStart(h);let d=t,n=0,g=0;
  if(isSched(h,dk(d))&&!doneOn(h.id,dk(d)))d=addD(d,-1);
  while(g++<3650){const k=dk(d);if(k<st)break;if(isSched(h,k)){if(doneOn(h.id,k))n++;else break}d=addD(d,-1)}
  if(h.freq==='sched')return {n,unit:n===1?'vez seguida':'seguidas'};
  return {n,unit:n===1?'dia':'dias'};
}
function consistencyRange(h,from,to){
  const t=today(),st=hStart(h);if(from<st)from=st;if(to>t)to=t;if(from>to)return null;
  if(h.freq==='weekly'){const tg=h.target||1;let weeks=0,met=0,mon=monOf(pd(from));
    while(dk(mon)<=to){const ok=weekCount(h,mon)>=tg;if(dk(addD(mon,6))<t||ok){weeks++;if(ok)met++}mon=addD(mon,7)}
    return weeks?met/weeks:null}
  let n=0,d=0,x=pd(from),g=0;
  while(dk(x)<=to&&g++<4000){const k=dk(x);if(isSched(h,k)){const done=doneOn(h.id,k);if(!(k===t&&!done)){n++;if(done)d++}}x=addD(x,1)}
  return n?d/n:null;
}
const consistency=(h,days=30)=>consistencyRange(h,dk(addD(new Date(),-(days-1))),today());
function dayPct(key){
  const base=activeHabits().filter(h=>h.freq!=='weekly'&&hStart(h)<=key);
  const hs=base.filter(h=>isSched(h,key));
  if(!base.length){const l=S.logs[key.slice(0,7)];return l&&l.days&&l.days[key]&&l.days[key].length?1:null}
  if(!hs.length)return null;
  return hs.filter(h=>doneOn(h.id,key)).length/hs.length;
}
const dueToday=()=>activeHabits().filter(h=>doneOn(h.id,today())||(h.freq==='weekly'?weekCount(h,monOf(new Date()))<(h.target||1):isSched(h,today())));
const habFreqLabel=x=>x.freq==='weekly'?`${x.target||1}× por semana`:x.freq==='sched'?recLabel(x.rec):'diário';

// Inclusive calendar ranges; due remains the final task deadline.
const calendarOn=(x,key,task=false)=>{const end=task?x.due:(x.endDate||x.date);const start=task?(x.startDate||x.due):x.date;return !!start&&start<=key&&key<=end};
const rangeLabel=(start,end)=>start&&end&&start!==end?`${fmtD(start)} – ${fmtD(end)}`:'';
function rangeFields(prefix,start,end){return `<label class="chip"><input type="checkbox" id="${prefix}-multi" data-range="${prefix}" ${end&&start!==end?'checked':''}> Mais de um dia</label><div class="frow" id="${prefix}-range" ${end&&start!==end?'':'hidden'}><div class="field"><label for="${prefix}-until">Até (inclusive)</label><input type="date" id="${prefix}-until" value="${esc(end||start||'')}" min="${esc(start||'')}"></div></div>`}
function syncRange(prefix){const multi=document.getElementById(prefix+'-multi'),end=document.getElementById(prefix+'-until'),start=document.getElementById(prefix);if(!multi||!end||!start)return;document.getElementById(prefix+'-range').hidden=!multi.checked;end.required=multi.checked;start.required=multi.checked||prefix!=='f-due';end.min=start.value;end.setCustomValidity(multi.checked&&end.value<start.value?'A data final deve ser igual ou posterior à inicial.':'')}
const rangeEnd=prefix=>document.getElementById(prefix+'-multi')?.checked?fv(prefix+'-until'):'';
document.addEventListener('change',e=>{for(const prefix of ['f-due','f-date','w-date'])if(e.target.id.startsWith(prefix))syncRange(prefix)});

/* ============ tasks ============ */
function taskBuckets(list){
  const t=today(),n7=dk(addD(new Date(),7));
  const b={late:[],today:[],week:[],later:[],none:[]};
  list.forEach(x=>{if(!x.due)b.none.push(x);else if(x.due<t)b.late.push(x);else if(x.due===t)b.today.push(x);else if(x.due<=n7)b.week.push(x);else b.later.push(x)});
  const s=(a,b)=>(a.due||'').localeCompare(b.due||'')||(a.prio||2)-(b.prio||2);
  Object.values(b).forEach(a=>a.sort(s));return b;
}
// cor do prazo (vale para tudo que tem data de cumprimento): vencido ou até 5 dias → vermelho · 6 a 7 dias → amarelo · 8 ou mais → verde
const dueLvl=k=>{const d=daysBetween(today(),k);return d<=5?'red':d<=7?'yellow':'green'};
const dueD=k=>{const d=pd(k);return `${pad(d.getDate())} ${MES[d.getMonth()]}`};
function dueTag(x){
  if(!x.due)return '';
  if(x.startDate&&x.startDate!==x.due)return `<span class="${x.done?'tag':'due due-'+dueLvl(x.due)}">${tn(rangeLabel(x.startDate,x.due))}</span>`;
  if(x.done)return `<span class="tag">${tn(fmtD(x.due))}</span>`;
  const d=daysBetween(today(),x.due);
  return `<span class="due due-${dueLvl(x.due)}">${tn(d<0?`atrasada · ${dueD(x.due)}`:d===0?'hoje':d===1?'amanhã':dueD(x.due))}</span>`;
}
const PRIO={1:'Alta',2:'Média',3:'Baixa'};
function taskRow(x,showCategory=true){
  const meta=`${showCategory?catChip(x.cat):''}${dueTag(x)}${x.prio&&x.prio!=2?`<span class="prio p${x.prio}">${x.prio==1?'▲ Alta':'▽ Baixa'}</span>`:''}${hasRec(x.rec)?`<span class="tag rec">↻ ${esc(recLabel(x.rec))}</span>`:''}${goalOf(x.goalId)?`<span class="tag goal">◎ ${esc(goalOf(x.goalId).title)}</span>`:''}${x.notes?'<span class="muted small">· nota</span>':''}`;
  return `<div class="row ${x.done?'done':''}" data-key="t:${x.id}">
    <button class="check" role="checkbox" aria-checked="${!!x.done}" aria-label="Concluir ${esc(x.title)}" data-act="task-toggle" data-id="${x.id}">${CHECK}</button>

function mcpMsg(server,e){
  const c=e&&e.code;
  switch(c){
    case 'needs_reauth':return `A conexão com ${server} expirou ou foi recusada. Reconecte em Ajustes → Conexões.`;
    case 'server_not_connected':case 'not_configured':return `${server} não está configurado. Abra Ajustes → Conexões e dados.`;
    case 'selection_required':return `Há mais de uma conexão ${server}. Escolha qual usar no aviso do Claude e recarregue.`;
    case 'not_in_manifest':return `O acesso ao ${server} foi recusado para esta página.`;
    case 'blocked_by_policy':case 'approval_required':return `A política da organização bloqueia o ${server} aqui.`;
    case 'server_unavailable':case 'rate_limited':return `${server} não respondeu. Tente de novo em instantes.`;
    case 'not_granted':case 'capability_disabled':case 'capability_removed':return `Conectores indisponíveis nesta visualização.`;
    case 'tool_error':return `${server} retornou erro: ${e.message||''}`;
    default:return `Não foi possível falar com ${server}${e&&e.message?': '+e.message:''}.`;
  }
}
const AUTHZ=['needs_reauth','server_not_connected','blocked_by_policy','approval_required','not_in_manifest','selection_required','not_granted','capability_disabled'];
function normGcal(ev){
  const st=ev.start||{},en=ev.end||{};const out={id:ev.id,title:ev.summary||'(sem título)',link:ev.htmlLink||'',meet:ev.conferenceUrl||'',days:[],time:'',endTime:'',allDay:!!st.date};
  if(st.date){let d=pd(st.date);const e=en.date?pd(en.date):addD(d,1);let g=0;while(d<e&&g<62){out.days.push(dk(d));d=addD(d,1);g++}}
  else if(st.dateTime){const s=new Date(st.dateTime);out.days.push(dk(s));out.time=`${pad(s.getHours())}:${pad(s.getMinutes())}`;if(en.dateTime){const e=new Date(en.dateTime);out.endTime=`${pad(e.getHours())}:${pad(e.getMinutes())}`}}
  return out;
}
function watchCal(slot,start,end){
  if(window.COMPASSO_CONFIG&&window.COMPASSO_CONFIG.googleEnabled===false)return;
  if(!mcp)return;const key=dk(start)+'_'+dk(end);const g=G[slot];if(g.key===key)return;
  if(g.unsub)g.unsub();
  g.key=key;g.events=[];g.err=null;g.loading=true;g.retried=false;
  const input={startTime:start.toISOString(),endTime:end.toISOString(),orderBy:'startTime',pageSize:250};
  const run=()=>{g.unsub=mcp.watchTool('Google Calendar','list_events',input,ev=>{
    if(g.key!==key)return;
    if(ev.type==='data'){
      let p=ev.result&&ev.result.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch{p=null}}
      g.events=((p&&p.events)||[]).filter(e=>e.status!=='cancelled').map(normGcal);
      g.err=null;g.loading=false;g.at=(ev.result.cache&&ev.result.cache.storedAt)||Date.now();
    }else{
      const e=ev.error||{};g.loading=false;g.err=e;
      if(AUTHZ.includes(e.code))g.events=[];
      else if(e.retryable&&!g.retried){g.retried=true;setTimeout(()=>{if(g.key===key){g.unsub&&g.unsub();run()}},(e.retryAfterMs||1500)+Math.random()*1000)}
    }
    schedule();
  },{refetchInterval:300000})};
  run();
}
function gcalFor(key){
  const seen=new Set(),out=[];
  [G.month,G.soon].forEach(g=>g.events.forEach(e=>{if(e.days.includes(key)&&!seen.has(e.id)){seen.add(e.id);out.push(e)}}));
  return out.sort((a,b)=>(a.allDay?'':a.time).localeCompare(b.allDay?'':b.time));
}
function calStatus(){
  if(window.COMPASSO_CONFIG&&window.COMPASSO_CONFIG.googleEnabled===false)return {cls:'',t:'Agenda do Compasso'};
  if(!mcp)return {cls:'',t:'Google Calendar indisponível aqui'};
  const e=G.month.err||G.soon.err;
  if(e&&e.code==='not_configured')return {cls:'',t:'Google Calendar não configurado'};
  if(e)return {cls:'err',t:mcpMsg('Google Calendar',e)};
  if(G.month.loading&&G.soon.loading)return {cls:'wait',t:'Google Calendar: carregando…'};
  const at=Math.max(G.month.at,G.soon.at);
  return {cls:'ok',t:`Google Calendar · ${at?'atualizado '+new Date(at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'conectado'}`};
}
const gNeedsAuth=()=>!!window.CompassoLocal&&((G.month.err||G.soon.err||{}).code==='needs_reauth');
async function syncStrava(manual){
  if(!mcp){if(manual)toast('Conectores indisponíveis nesta visualização.');return}
  if(SV.busy)return;SV.busy=true;SV.err=null;SV.msg='Sincronizando Strava…';schedule();
  try{
    const r=await mcp.callTool('Strava','list_activities',{first:60},{cache:false});
    let p=r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch{p=null}}
    const acts=(p&&p.activities)||[];let n=0;const nd=new Set();
    for(const a of acts){
      const id='strava-'+a.id;if(S.workouts.some(w=>w.id===id))continue;
      const w=mapStrava(a);if(!w.date)continue;
      S.workouts.push({id,...w});n++;nd.add(w.date);
      if(db){try{await db.doc('workouts/'+id).set(w)}catch(e){dbFail(e);break}}
    }
    const hm=n?activeHabits().filter(h=>h.autoW&&[...nd].some(k=>autoW(h.id,k).length)).map(h=>h.name):[];
    SV.at=Date.now();SV.msg=n?`${n} atividade${n>1?'s':''} importada${n>1?'s':''} do Strava${hm.length?` · ${hm.join(', ')} marcado`:''}`:'Strava em dia';
    if(manual||n)toast(SV.msg);

  SV.busy=false;schedule();
}
